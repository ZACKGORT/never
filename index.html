<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>neverever.land</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;500;600&family=Noto+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Atkinson+Hyperlegible+Next:wght@400;500;600;700&family=Source+Sans+3:wght@400;500;600;700&family=Roboto:wght@400;500;700&family=Open+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
        :root {
            --paper: #3D6BEF;
            --panel: #3159D4;
            --ink: #ffffff;
            --grey: rgba(255, 255, 255, 0.52);
            --grey-dim: rgba(255, 255, 255, 0.32);
            --rule: rgba(255, 255, 255, 0.16);
            --rule-strong: #ffffff;
            --unit: 8px;
            --gutter: calc(var(--unit)*3);
            --margin: calc(var(--unit)*5);
            --cols: 12;
            --radius: 0px;
            --radius-sm: 0px;
            --fs-micro: 10px;
            --fs-body: 15px;
            --fs-display: 64px;
            --max-width: 1440px;
            --font-display: 'Space Grotesk', 'Helvetica Neue', sans-serif;
            --font-body: 'Inter', 'Helvetica Neue', sans-serif;
            --font-mono: 'JetBrains Mono', 'IBM Plex Mono', monospace;
            --transition: 0.25s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }
        /* ── scale variants ── */
        body[data-scale="s"] {
            --fs-body: 12px;
            --fs-display: 40px;
        }
        body[data-scale="m"] {
            --fs-body: 15px;
            --fs-display: 54px;
        }
        body[data-scale="l"] {
            --fs-body: 18px;
            --fs-display: 68px;
        }
        body[data-scale="xl"] {
            --fs-body: 21px;
            --fs-display: 82px;
        }
        body[data-scale="xxl"] {
            --fs-body: 24px;
            --fs-display: 96px;
        }
        /* ── font variants ── */
        body[data-font="grotesk"] {
            --font-display: 'Space Grotesk', sans-serif;
            --font-body: 'Inter', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
        }
        body[data-font="serif"] {
            --font-display: 'EB Garamond', serif;
            --font-body: 'EB Garamond', serif;
            --font-mono: 'JetBrains Mono', monospace;
        }
        body[data-font="mono"] {
            --font-display: 'JetBrains Mono', monospace;
            --font-body: 'JetBrains Mono', monospace;
            --font-mono: 'JetBrains Mono', monospace;
        }
        body[data-font="noto"] {
            --font-display: 'Noto Sans', sans-serif;
            --font-body: 'Noto Sans', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
        }
        body[data-font="atkinson"] {
            --font-display: 'Atkinson Hyperlegible Next', sans-serif;
            --font-body: 'Atkinson Hyperlegible Next', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
        }
        body[data-font="source"] {
            --font-display: 'Source Sans 3', sans-serif;
            --font-body: 'Source Sans 3', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
        }
        body[data-font="roboto"] {
            --font-display: 'Roboto', sans-serif;
            --font-body: 'Roboto', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
        }
        body[data-font="opensans"] {
            --font-display: 'Open Sans', sans-serif;
            --font-body: 'Open Sans', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        html {
            -webkit-text-size-adjust: 100%;
        }
        body {
            background: var(--paper);
            color: var(--ink);
            font-family: var(--font-body);
            font-size: var(--fs-body);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            min-height: 100vh;
            transition: font-size 0.2s ease, font-family 0.2s ease;
        }
        ::selection {
            background: var(--ink);
            color: var(--paper);
        }
        a {
            color: inherit;
            text-decoration: none;
        }

        /* scrollbar */
        html {
            scrollbar-width: thin;
            scrollbar-color: var(--grey-dim) transparent;
        }
        ::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--grey-dim);
            border-radius: var(--radius-sm);
        }

        /* utility */
        .t-micro {
            font-family: var(--font-mono);
            font-size: var(--fs-micro);
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--grey);
            line-height: 1.4;
        }
        .t-data {
            font-family: var(--font-mono);
            font-variant-numeric: tabular-nums;
        }
        .t-display {
            font-family: var(--font-display);
            letter-spacing: -0.02em;
        }

        .btn {
            font-family: var(--font-mono);
            font-size: var(--fs-micro);
            letter-spacing: 0.08em;
            text-transform: uppercase;
            background: transparent;
            border: 1px solid var(--rule-strong);
            color: var(--ink);
            padding: 7px 16px;
            cursor: pointer;
            transition: background .2s ease, color .2s ease, border-color .2s ease;
            border-radius: var(--radius-sm);
        }
        .btn:hover {
            background: var(--ink);
            color: var(--paper);
        }
        .btn.ghost {
            border-color: var(--rule);
            color: var(--grey);
        }
        .btn.ghost:hover {
            background: var(--ink);
            color: var(--paper);
            border-color: var(--ink);
        }
        .btn.small {
            padding: 4px 10px;
            font-size: 8px;
        }
        .btn.active {
            background: var(--ink);
            color: var(--paper);
            border-color: var(--ink);
        }

        /* topbar */
        .topbar {
            position: sticky;
            top: 0;
            z-index: 50;
            background: var(--paper);
            border-bottom: 1px solid var(--rule);
            padding: 14px 0;
        }
        .topbar .wrap {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            padding: 0 var(--margin);
            max-width: var(--max-width);
            margin: 0 auto;
        }
        .wordmark {
            font-family: var(--font-display);
            font-size: calc(var(--fs-body) * 1.2);
            font-weight: 600;
            letter-spacing: -0.03em;
            display: flex;
            align-items: baseline;
            gap: 10px;
            flex-shrink: 0;
        }
        .wordmark .count {
            font-family: var(--font-mono);
            font-size: var(--fs-micro);
            font-weight: 400;
            color: var(--grey);
            letter-spacing: 0.04em;
        }
        .save-status {
            font-family: var(--font-mono);
            font-size: 8px;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: var(--grey-dim);
            transition: color .2s ease;
        }
        .save-status.err {
            color: #FFB4A8;
            cursor: pointer;
        }
        .save-status.ok {
            color: var(--grey-dim);
        }
        .topbar-actions {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: flex-end;
        }
        .topbar-controls {
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--panel);
            padding: 4px 8px 4px 12px;
            border: 1px solid var(--rule);
            border-radius: var(--radius-sm);
        }
        .topbar-controls .font-select {
            background: transparent;
            border: none;
            color: var(--ink);
            font-family: var(--font-body);
            font-size: 10px;
            padding: 4px 4px 4px 0;
            cursor: pointer;
            outline: none;
            max-width: 80px;
        }
        .topbar-controls .font-select option {
            background: var(--panel);
            color: var(--ink);
        }
        .topbar-controls .scale-group {
            display: flex;
            gap: 2px;
            border-left: 1px solid var(--rule);
            padding-left: 8px;
        }
        .topbar-controls .scale-group .chip {
            border: none;
            padding: 2px 6px;
            font-size: 9px;
            color: var(--grey);
            background: transparent;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-family: var(--font-mono);
            letter-spacing: 0.04em;
        }
        .topbar-controls .scale-group .chip.active {
            background: var(--ink);
            color: var(--paper);
        }
        .topbar-controls .scale-group .chip:hover {
            color: var(--ink);
        }

        /* ── main wrap ── */
        .wrap {
            max-width: 100%;
            margin: 0 auto;
            padding: 0 var(--margin) 120px;
            transition: padding 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        /* composer */
        .composer {
            border-bottom: 1px solid var(--rule);
            padding: 24px 0;
            display: none;
            flex-direction: column;
            gap: 12px;
        }
        .composer.open {
            display: flex;
        }
        .field-row {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }
        .field-row .field {
            flex: 1;
            min-width: 140px;
        }
        label.t-micro {
            display: block;
            margin-bottom: 4px;
            font-size: 8px;
            letter-spacing: 0.1em;
        }
        input[type=text],
        textarea,
        select {
            width: 100%;
            background: var(--panel);
            border: 1px solid var(--rule);
            color: var(--ink);
            padding: 10px 12px;
            font-size: calc(var(--fs-body) * 0.9);
            font-family: var(--font-body);
            border-radius: var(--radius-sm);
            resize: vertical;
            transition: border-color .2s ease;
        }
        input[type=text]:focus,
        textarea:focus,
        select:focus {
            outline: none;
            border-color: var(--rule-strong);
        }
        textarea {
            min-height: 68px;
            line-height: 1.6;
        }
        .composer-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            align-items: center;
        }
        .new-author-panel {
            border: 1px dashed var(--rule);
            padding: 14px;
            display: none;
            flex-direction: column;
            gap: 10px;
        }
        .new-author-panel.open {
            display: flex;
        }
        .kind-radios {
            display: flex;
            gap: 16px;
        }
        .kind-radios label {
            display: flex;
            align-items: center;
            gap: 6px;
            font-family: var(--font-mono);
            font-size: 9px;
            text-transform: uppercase;
            letter-spacing: .06em;
            cursor: pointer;
        }

        /* avatar */
        .avatar {
            flex: none;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: var(--font-display);
            font-weight: 600;
            border: 1px solid var(--rule-strong);
            position: relative;
            text-transform: uppercase;
            border-radius: var(--radius-sm);
        }
        .avatar.sz-xs {
            width: 20px;
            height: 20px;
            font-size: 8px;
        }
        .avatar.sz-sm {
            width: 28px;
            height: 28px;
            font-size: 10px;
        }
        .avatar.sz-md {
            width: 44px;
            height: 44px;
            font-size: 14px;
        }
        .avatar.sz-lg {
            width: 60px;
            height: 60px;
            font-size: 18px;
        }
        .avatar.v0 {
            background: var(--ink);
            color: var(--paper);
        }
        .avatar.v1 {
            background: transparent;
            color: var(--ink);
        }
        .avatar.v2 {
            background: var(--grey-dim);
            color: var(--paper);
        }
        .avatar.v3 {
            background: var(--panel);
            color: var(--ink);
            border-color: var(--rule);
        }
        .avatar.company::after {
            content: '';
            position: absolute;
            top: -3px;
            right: -3px;
            width: 6px;
            height: 6px;
            background: var(--paper);
            border: 1px solid var(--rule-strong);
            border-radius: var(--radius-sm);
        }
        .co-badge {
            font-family: var(--font-mono);
            font-size: 7px;
            color: var(--grey-dim);
            border: 1px solid var(--rule);
            padding: 0 4px;
            flex: none;
            letter-spacing: 0.06em;
        }

        /* ── image thumbnail styles ── */
        .thumb {
            border-radius: var(--radius-sm);
            overflow: hidden;
            background: rgba(0, 0, 0, 0.2);
            flex: none;
            line-height: 0;
        }
        .thumb img,
        .thumb video {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .thumb-sm {
            width: 56px;
            height: 40px;
            border: 1px solid var(--rule);
        }
        .thumb-md {
            width: 100%;
            height: 120px;
            border: 1px solid var(--rule);
            margin: 6px 0 4px;
        }
        .thumb-lg {
            border: 1px solid var(--rule);
            margin: 14px 0 16px;
            border-radius: var(--radius-sm);
            max-height: 440px;
            background: rgba(0, 0, 0, 0.2);
        }
        .thumb-lg img,
        .thumb-lg video {
            display: block;
            width: 100%;
            height: auto;
            max-height: 440px;
            object-fit: cover;
        }
        .thumb-grid {
            width: 100%;
            height: 140px;
            border: 1px solid var(--rule);
            border-radius: var(--radius-sm);
            margin: 6px 0 4px;
            overflow: hidden;
            background: rgba(0, 0, 0, 0.15);
        }
        .thumb-grid img,
        .thumb-grid video {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .thumb-grid video {
            background: #000;
        }

        /* list */
        .list {
            border-top: 1px solid var(--rule);
            padding-top: 4px;
        }
        .row {
            display: grid;
            grid-template-columns: 28px 34px 130px 74px 1fr 34px;
            align-items: center;
            gap: 12px;
            padding: 12px 0;
            border-bottom: 1px solid var(--rule);
            cursor: pointer;
            transition: background .15s ease;
        }
        .row:hover {
            background: rgba(255, 255, 255, 0.04);
        }
        .row-idx {
            font-family: var(--font-mono);
            font-size: 11px;
            color: var(--grey-dim);
        }
        .row-author {
            font-family: var(--font-display);
            font-size: calc(var(--fs-body) * 0.85);
            font-weight: 500;
            letter-spacing: 0.02em;
            text-transform: uppercase;
            color: var(--ink);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .row-time {
            font-family: var(--font-mono);
            font-size: 10px;
            color: var(--grey);
            white-space: nowrap;
        }
        .row-text {
            color: var(--grey);
            font-size: calc(var(--fs-body) * 0.95);
            font-weight: 400;
            white-space: normal;
            word-wrap: break-word;
            line-height: 1.5;
        }
        .row-marker {
            font-family: var(--font-mono);
            font-size: 9px;
            color: var(--grey-dim);
            text-align: right;
            display: flex;
            align-items: center;
            gap: 4px;
            justify-content: flex-end;
        }
        .row-marker .thumb-sm {
            width: 40px;
            height: 30px;
        }

        .empty {
            padding: 60px 0;
            text-align: left;
        }
        .empty .t-micro {
            margin-bottom: 6px;
        }
        .empty p {
            font-family: var(--font-display);
            font-size: calc(var(--fs-display) * 0.5);
            font-weight: 600;
            letter-spacing: -0.02em;
            margin: 0 0 16px;
        }

        /* ── GRID MODE — REFINED & AESTHETIC ── */
        body.grid-mode .wrap {
            max-width: 100%;
            padding-left: var(--margin);
            padding-right: var(--margin);
        }

        body.grid-mode .list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 28px 32px;
            border-top: none;
            padding-top: 28px;
        }

        body.grid-mode .row {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            padding: 22px 24px 26px;
            background: var(--panel);
            border: 1px solid var(--rule);
            border-radius: var(--radius-sm);
            transition: transform 0.25s cubic-bezier(0.25, 0.46, 0.45, 0.94),
                border-color 0.25s ease,
                box-shadow 0.25s ease;
            cursor: pointer;
            gap: 8px;
            grid-template-columns: none;
            grid-template-areas: none;
            position: relative;
        }

        body.grid-mode .row:hover {
            transform: translateY(-4px);
            border-color: var(--rule-strong);
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.18);
        }

        body.grid-mode .row .row-idx {
            display: none;
        }

        body.grid-mode .row .row-avatar {
            margin-bottom: 6px;
        }
        body.grid-mode .row .row-avatar .avatar {
            width: 48px;
            height: 48px;
            font-size: 16px;
        }

        body.grid-mode .row .row-meta {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 4px 12px;
            width: 100%;
            font-size: calc(var(--fs-body) * 0.75);
            border-bottom: 1px solid var(--rule);
            padding-bottom: 12px;
            margin-bottom: 4px;
        }

        body.grid-mode .row .row-author {
            font-family: var(--font-display);
            font-size: calc(var(--fs-body) * 1.0);
            font-weight: 600;
            letter-spacing: 0.02em;
            text-transform: uppercase;
            color: var(--ink);
            overflow: visible;
            white-space: normal;
            text-overflow: clip;
        }

        body.grid-mode .row .row-time {
            font-family: var(--font-mono);
            font-size: calc(var(--fs-body) * 0.7);
            color: var(--grey);
            white-space: nowrap;
        }

        body.grid-mode .row .row-text {
            font-family: var(--font-display);
            font-size: calc(var(--fs-display) * 0.3);
            font-weight: 500;
            line-height: 1.4;
            letter-spacing: -0.02em;
            color: var(--ink);
            width: 100%;
            margin: 6px 0 10px;
            padding-right: 4px;
            white-space: normal;
            overflow: visible;
            text-overflow: clip;
        }

        body.grid-mode .row .row-marker {
            font-family: var(--font-mono);
            font-size: calc(var(--fs-body) * 0.65);
            color: var(--grey-dim);
            align-self: flex-start;
            margin-top: 4px;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            border-top: 1px solid var(--rule);
            padding-top: 12px;
            width: 100%;
            display: flex;
            align-items: center;
            gap: 8px;
            justify-content: flex-start;
        }

        body.grid-mode .row .thumb-grid {
            width: 100%;
            height: 170px;
            border: 1px solid var(--rule);
            border-radius: var(--radius-sm);
            margin: 4px 0 8px;
            overflow: hidden;
            background: rgba(0, 0, 0, 0.15);
        }

        body.grid-mode .row .thumb-grid img,
        body.grid-mode .row .thumb-grid video {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        body.grid-mode .row .thumb-grid video {
            background: #000;
        }

        /* expanded card in grid mode */
        body.grid-mode .card {
            grid-column: 1 / -1;
            background: var(--panel);
            padding: 28px 32px 32px;
            border: 1px solid var(--rule-strong);
            border-radius: var(--radius-sm);
            margin-bottom: 0;
        }

        body.grid-mode .empty {
            grid-column: 1 / -1;
            text-align: left;
            padding: 60px 0;
        }

        /* responsive grid */
        @media (max-width: 760px) {
            body.grid-mode .list {
                grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
                gap: 20px;
                padding-left: 0;
                padding-right: 0;
            }
            body.grid-mode .wrap {
                padding-left: 20px;
                padding-right: 20px;
            }
            body.grid-mode .row .row-text {
                font-size: calc(var(--fs-display) * 0.3);
            }
            body.grid-mode .card .card-text {
                font-size: calc(var(--fs-display) * 0.4);
            }
            .topbar .wrap,
            .hud-row {
                padding-left: 16px;
                padding-right: 16px;
            }
            .wrap {
                padding-left: 16px;
                padding-right: 16px;
            }
            .topbar-controls .scale-group .chip {
                font-size: 8px;
                padding: 2px 4px;
            }
            .topbar-controls .font-select {
                max-width: 60px;
                font-size: 9px;
            }
            .bento-panel {
                padding: 24px 20px;
            }
        }

        @media (max-width: 520px) {
            body.grid-mode .list {
                grid-template-columns: 1fr;
                gap: 16px;
            }
            body.grid-mode .row {
                padding: 16px 18px 20px;
            }
            body.grid-mode .row .row-text {
                font-size: calc(var(--fs-display) * 0.3);
            }
            .row {
                grid-template-columns: 24px 20px 1fr 30px;
                grid-template-areas: "idx avatar text marker" ". avatar meta marker";
                row-gap: 2px;
                align-items: start;
            }
            .row-idx {
                grid-area: idx;
            }
            .row-avatar {
                grid-area: avatar;
            }
            .row-text {
                grid-area: text;
            }
            .row-marker {
                grid-area: marker;
                justify-content: flex-end;
            }
            .row-meta {
                grid-area: meta;
                display: flex;
                gap: 6px;
                font-size: 10px;
            }
            .field-row {
                flex-direction: column;
            }
            .conversation-modal .modal-card {

            // ── storage ────────────────────────────────────────────────

            async function loadData() {
                try {
                    const res = await window.storage.get(STORAGE_KEY, false);
                    if (res && res.value) {
                        const parsed = JSON.parse(res.value);
                        authors = parsed.authors || [];
                        statements = parsed.statements || [];
                        if (authors.length && statements.length) return;
                    }
                } catch (e) { /* no data yet */ }
                authors = seedAuthors();
                statements = seedStatements(authors);
                await saveData();
            }

            let saveInFlight = false;
            let pendingRetry = false;

            function setSaveStatus(state) {
                const el = document.getElementById('saveStatus');
                if (!el) return;
                el.classList.remove('err', 'ok');
                if (state === 'saving') { el.textContent = '· saving…'; } else if (state === 'ok') { el.textContent =
                        '· saved';
                    el.classList.add('ok'); } else if (state === 'err') { el.textContent = '· not saved — click to retry';
                    el.classList.add('err'); } else { el.textContent = ''; }
            }

            async function saveData(isRetry) {
                if (saveInFlight) { pendingRetry = true; return; }
                saveInFlight = true;
                setSaveStatus('saving');
                try {
                    await window.storage.set(STORAGE_KEY, JSON.stringify({ authors, statements }), false);
                    setSaveStatus('ok');
                } catch (e) {
                    console.error('storage save failed', e);
                    if (!isRetry) {
                        saveInFlight = false;
                        await new Promise(r => setTimeout(r, 800));
                        return saveData(true);
                    }
                    setSaveStatus('err');
                } finally {
                    saveInFlight = false;
                    if (pendingRetry) { pendingRetry = false;
                        saveData(); }
                }
            }

            document.getElementById('saveStatus').addEventListener('click', () => {
                if (document.getElementById('saveStatus').classList.contains('err')) saveData();
            });

            function fmtTime(ts) {
                const d = new Date(ts);
                const now = new Date();
                const sameDay = d.toDateString() === now.toDateString();
                const yest = new Date(now);
                yest.setDate(now.getDate() - 1);
                const isYest = d.toDateString() === yest.toDateString();
                const hh = d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }).toUpperCase();
                if (sameDay) return 'TODAY ' + hh;
                if (isYest) return 'YESTERDAY';
                return d.toLocaleDateString([], { month: 'short', day: 'numeric' }).toUpperCase();
            }

            function isVideo(url) { return /\.(mp4|webm|mov)(\?|$)/i.test(url); }

            function countReplies(node) {
                let n = node.replies.length;
                node.replies.forEach(r => n += countReplies(r));
                return n;
            }

            function countAuthorActivity(authorId) {
                let statementsCount = 0,
                    repliesCount = 0;

                function walk(node, isTop) {
                    if (node.authorId === authorId) { isTop ? statementsCount++ : repliesCount++; }
                    node.replies.forEach(r => walk(r, false));
                }
                statements.forEach(s => walk(s, true));
                return { statementsCount, repliesCount };
            }

            function escapeHtml(s) {
                return (s || '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;',
                    "'": '&#39;' } [c]));
            }

            function el(html) {
                const t = document.createElement('template');
                t.innerHTML = html.trim();
                return t.content.firstElementChild;
            }

            function avatarHtml(authorId, size) {
                const a = authorById(authorId);
                if (!a) return `<div class="avatar sz-${size} v1">?</div>`;
                const cls = ['avatar', 'sz-' + size, avatarVariant(a.id)];
                if (a.kind === 'company') cls.push('company');
                return `<div class="${cls.join(' ')}">${escapeHtml(initialsFor(a))}</div>`;
            }

            // ── profile modal ──────────────────────────────────────────

            function openProfile(authorId) {
                const a = authorById(authorId);
                if (!a) return;
                document.getElementById('profileAvatarSlot').innerHTML = avatarHtml(a.id, 'lg');
                document.getElementById('profileName').textContent = a.name;
                document.getElementById('profileKind').textContent = a.kind === 'company' ? 'COMPANY / BRAND' : 'PERSON';
                document.getElementById('profileRole').textContent = a.role || '';
                document.getElementById('profileTagline').textContent = a.tagline || '';
                const { statementsCount, repliesCount } = countAuthorActivity(a.id);
                document.getElementById('profileStats').textContent =
                    `${statementsCount} STATEMENT${statementsCount===1?'':'S'} · ${repliesCount} REPL${repliesCount===1?'Y':'IES'}`;
                document.getElementById('profileModal').hidden = false;
            }
            document.getElementById('profileClose').addEventListener('click', () => document.getElementById('profileModal')
                .hidden = true);
            document.getElementById('profileModal').addEventListener('click', (e) => {
                if (e.target.id === 'profileModal') document.getElementById('profileModal').hidden = true;
            });

            // ── filters ────────────────────────────────────────────────

            function passesFilters(s) {
                const a = authorById(s.authorId);
                if (!a) return false;

                // Search filter
                if (searchQuery) {
                    const q = searchQuery.toLowerCase();
                    const matchesText = s.text.toLowerCase().includes(q);
                    const matchesAuthor = a.name.toLowerCase().includes(q);
                    const matchesTag = s.tag ? s.tag.toLowerCase().includes(q) : false;
                    if (!matchesText && !matchesAuthor && !matchesTag) return false;
                }

                const tagOk = activeTags.size === 0 || (s.tag && activeTags.has(s.tag));
                const kindOk = activeKinds.size === 0 || (a && activeKinds.has(a.kind));
                const discOk = activeDisciplines.size === 0 || (a && activeDisciplines.has(a.discipline));
                return tagOk && kindOk && discOk;
            }

            function filtersActive() {
                return activeTags.size > 0 || activeKinds.size > 0 || activeDisciplines.size > 0 || searchQuery.length > 0;
            }

            function clearFilters() {
                activeTags.clear();
                activeKinds.clear();
                activeDisciplines.clear();
                searchQuery = '';
                document.getElementById('bentoSearch').value = '';
                render();
                updateFilterUI();
            }

            // ── conversation modal ──────────────────────────────────────

            function openConversation(statementId) {
                modalStatementId = statementId;
                modalReplyTargetId = null;
                const modal = document.getElementById('conversationModal');
                modal.classList.add('open');
                document.body.style.overflow = 'hidden';
                renderModalContent(statementId);
            }

            function closeConversation() {
                document.getElementById('conversationModal').classList.remove('open');
                document.body.style.overflow = '';
                modalStatementId = null;
                modalReplyTargetId = null;
            }

            // ── media helpers ──

            function renderMediaThumb(url, sizeClass) {
                if (!url) return '';
                const isVid = isVideo(url);
                const tag = isVid ? 'video' : 'img';
                const attrs = isVid ? 'controls playsinline muted' : 'alt=""';
                return `<div class="thumb ${sizeClass}"><${tag} src="${escapeHtml(url)}" ${attrs} loading="lazy" /></div>`;
            }

            function renderMediaHero(url) {
                if (!url) return '';
                const isVid = isVideo(url);
                const tag = isVid ? 'video' : 'img';
                const attrs = isVid ? 'controls playsinline' : 'alt=""';
                return `<div class="thumb-lg"><${tag} src="${escapeHtml(url)}" ${attrs} loading="lazy" /></div>`;
            }

            function renderMediaGrid(url) {
                if (!url) return '';
                const isVid = isVideo(url);
                const tag = isVid ? 'video' : 'img';
                const attrs = isVid ? 'controls playsinline muted' : 'alt=""';
                return `<div class="thumb-grid"><${tag} src="${escapeHtml(url)}" ${attrs} loading="lazy" /></div>`;
            }

            // ── modal rendering ──

            function renderModalNode(node, statement, depth) {
                const hasChildren = node.replies.length > 0;
                const isCollapsed = collapsed.has(node.id);
                const a = authorById(node.authorId);
                const wrap = document.createElement('div');
                wrap.className = 'modal-node';
                wrap.dataset.nodeId = node.id;

                let headHtml = `
              <div class="modal-node-head">
                ${hasChildren ? `<button class="modal-node-toggle" data-node-id="${node.id}">${isCollapsed ? '[+]' : '[–]'}</button>` : ''}
                ${avatarHtml(node.authorId,'xs')}
                <span class="modal-node-author" data-author-id="${node.authorId}">${a ? escapeHtml(a.name) : 'UNKNOWN'}</span>
                ${a && a.kind==='company' ? '<span class="co-badge">CO</span>' : ''}
                <span class="modal-node-time">${fmtTime(node.time)}</span>
                ${isCollapsed ? `<span class="modal-node-collapsed-note">(${countReplies(node)+1} hidden)</span>` : ''}
              </div>
            `;
                wrap.innerHTML = headHtml;

                const head = wrap.querySelector('.modal-node-head');
                head.querySelector('[data-author-id]').addEventListener('click', (e) => {
                    e.stopPropagation();
                    openProfile(e.target.dataset.authorId);
                });

                if (hasChildren) {
                    const toggle = head.querySelector('.modal-node-toggle');
                    toggle.addEventListener('click', (e) => {
                        e.stopPropagation();
                        if (isCollapsed) collapsed.delete(node.id);
                        else collapsed.add(node.id);
                        renderModalContent(modalStatementId);
                    });
                }

                if (!isCollapsed) {
                    const textDiv = document.createElement('div');
                    textDiv.className = 'modal-node-text';
                    textDiv.textContent = node.text;
                    wrap.appendChild(textDiv);

                    const actions = document.createElement('div');
                    actions.className = 'modal-node-actions';
                    const replyBtn = document.createElement('button');
                    replyBtn.className = 'modal-node-link';
                    replyBtn.textContent = 'reply';
                    replyBtn.dataset.action = 'reply';
                    replyBtn.dataset.nodeId = node.id;
                    replyBtn.addEventListener('click', () => {
                        modalReplyTargetId = (modalReplyTargetId === node.id) ? null : node.id;
                        renderModalContent(modalStatementId);
                    });
                    actions.appendChild(replyBtn);
                    wrap.appendChild(actions);

                    if (modalReplyTargetId === node.id) {
                        const form = renderModalReplyForm(node, statement);
                        wrap.appendChild(form);
                    }

                    if (node.replies.length > 0) {
                        const childWrap = document.createElement('div');
                        childWrap.className = 'modal-node-children';
                        node.replies.forEach(child => {
                            childWrap.appendChild(renderModalNode(child, statement, (depth || 0) + 1));
                        });
                        wrap.appendChild(childWrap);
                    }
                }

                return wrap;
            }

            function renderModalReplyForm(target, statement) {
                const form = document.createElement('div');
                form.className = 'modal-reply-form';
                const sel = document.createElement('select');
                sel.className = 'rf-author';
                sel.innerHTML = authorOptionsHtml();
                sel.value = lastAuthorId || authors[0].id;

                const ta = document.createElement('textarea');
                ta.className = 'rf-text';
                ta.placeholder = 'Write a reply…';
                ta.style.minHeight = '50px';

                const actions = document.createElement('div');
                actions.className = 'composer-actions';

                const cancelBtn = document.createElement('button');
                cancelBtn.className = 'btn ghost small';
                cancelBtn.textContent = 'Cancel';
                cancelBtn.dataset.action = 'cancel';
                cancelBtn.addEventListener('click', () => {
                    modalReplyTargetId = null;
                    renderModalContent(modalStatementId);
                });

                const submitBtn = document.createElement('button');
                submitBtn.className = 'btn small';
                submitBtn.textContent = 'Post reply';
                submitBtn.dataset.action = 'submit';
                submitBtn.addEventListener('click', () => {
                    const authorId = sel.value;
                    const text = ta.value.trim();
                    if (!text || !authorId) return;
                    lastAuthorId = authorId;
                    target.replies.push({ id: uid(), authorId, time: Date.now(), text, replies: [] });
                    modalReplyTargetId = null;
                    saveData();
                    renderModalContent(modalStatementId);
                    render();
                });

                actions.appendChild(cancelBtn);
                actions.appendChild(submitBtn);
                form.appendChild(sel);
                form.appendChild(ta);
                form.appendChild(actions);
                return form;
            }

            function renderModalContent(statementId) {
                const s = statements.find(st => st.id === statementId);
                if (!s) return;
                const container = document.getElementById('modalContent');
                const a = authorById(s.authorId);

                let html = `
              <div class="modal-statement">
                <div class="card-who">
                  ${avatarHtml(s.authorId,'md')}
                  <div>
                    <div class="card-author-row">
                      <span class="card-author" data-author-id="${s.authorId}">${a ? escapeHtml(a.name) : 'UNKNOWN'}</span>
                      ${a && a.kind==='company' ? '<span class="co-badge">CO</span>' : ''}
                      <span class="card-time">${fmtTime(s.time)}</span>
                      ${s.tag ? `<span class="card-tag t-micro">${escapeHtml(s.tag)}</span>` : ''}
                    </div>
                    <div class="card-role">${a ? escapeHtml(a.role||'') : ''}</div>
                  </div>
                </div>
                ${renderMediaHero(s.mediaUrl)}
                <div class="card-text">${escapeHtml(s.text)}</div>
              </div>
              <div class="t-micro" style="margin-bottom:12px;">REPLIES (${countReplies(s)})</div>
              <div class="modal-thread" id="modalThread"></div>
              <div class="modal-reply-trigger" id="modalReplyTrigger"></div>
            `;

                container.innerHTML = html;

                container.querySelector('.card-author').addEventListener('click', () => {
                    openProfile(s.authorId);
                });

                const threadEl = container.querySelector('#modalThread');
                s.replies.forEach(r => {
                    threadEl.appendChild(renderModalNode(r, s, 0));
                });

                const trigger = container.querySelector('#modalReplyTrigger');
                const link = document.createElement('button');
                link.className = 'modal-node-link';
                link.textContent = '+ reply to this statement';
                link.addEventListener('click', () => {
                    modalReplyTargetId = (modalReplyTargetId === s.id) ? null : s.id;
                    renderModalContent(modalStatementId);
                });
                trigger.appendChild(link);

                if (modalReplyTargetId === s.id) {
                    const form = renderModalReplyForm(s, s);
                    trigger.appendChild(form);
                }
            }

            // ── rendering ──────────────────────────────────────────────

            function render() {
                if (gridMode) renderGrid();
                else renderList();
                updateFilterUI();
            }

            function renderList() {
                const root = document.getElementById('listRoot');
                root.innerHTML = '';

                if (statements.length === 0) {
                    document.getElementById('topCount').textContent = '000';
                    root.appendChild(el(`
                <div class="empty">
                  <div class="t-micro">000 STATEMENTS</div>
                  <p>Nothing here yet.</p>
                  <button class="btn" id="emptyNew">Write the first one</button>
                </div>
              `));
                    root.querySelector('#emptyNew').addEventListener('click', openComposer);
                    renderHud();
                    return;
                }

                const withIdx = statements.map((s, i) => ({ s, idx: String(statements.length - i).padStart(3, '0') }));
                const visible = withIdx.filter(x => passesFilters(x.s));

                document.getElementById('topCount').textContent = filtersActive() ?
                    `${String(visible.length).padStart(3,'0')} / ${String(statements.length).padStart(3,'0')}` :
                    String(statements.length).padStart(3, '0');

                if (visible.length === 0) {
                    root.appendChild(el(`
                <div class="hud-empty">
                  <div class="t-micro">NO MATCHES</div>
                  <p>No statements match these filters.</p>
                  <button class="btn ghost" id="clearFromEmpty">Clear filters</button>
                </div>
              `));
                    root.querySelector('#clearFromEmpty').addEventListener('click', clearFilters);
                    renderHud();
                    return;
                }

                const list = el('<div class="list"></div>');
                visible.forEach(({ s, idx }) => {
                    list.appendChild(renderRow(s, idx));
                });
                root.appendChild(list);
                populateAuthorSelects();
                renderHud();
            }

            function renderRow(s, idx) {
                const a = authorById(s.authorId);
                const marker = s.mediaUrl ? (isVideo(s.mediaUrl) ? 'VID' : 'IMG') : '';
                const row = el(`
              <div class="row" data-id="${s.id}">
                <div class="row-idx t-data">${idx}</div>
                <div class="row-avatar">${avatarHtml(s.authorId,'sm')}</div>
                <div class="row-meta" style="display:contents;">
                  <div class="row-author">${a ? escapeHtml(a.name) : 'UNKNOWN'}${a && a.kind==='company' ? ' <span class="co-badge">CO</span>' : ''}</div>
                  <div class="row-time">${fmtTime(s.time)}</div>
                </div>
                <div class="row-text">${escapeHtml(s.text)}</div>
                <div class="row-marker">
                  ${s.mediaUrl ? renderMediaThumb(s.mediaUrl, 'thumb-sm') : ''}
                  ${marker}
                </div>
              </div>
            `);
                row.addEventListener('click', () => { openConversation(s.id); });
                return row;
            }

            function renderGrid() {
                const root = document.getElementById('listRoot');
                root.innerHTML = '';

                if (statements.length === 0) {
                    document.getElementById('topCount').textContent = '000';
                    root.appendChild(el(`
                <div class="empty">
                  <div class="t-micro">000 STATEMENTS</div>
                  <p>Nothing here yet.</p>
                  <button class="btn" id="emptyNew">Write the first one</button>
                </div>
              `));
                    root.querySelector('#emptyNew').addEventListener('click', openComposer);
                    renderHud();
                    return;
                }

                const withIdx = statements.map((s, i) => ({ s, idx: String(statements.length - i).padStart(3, '0') }));
                const visible = withIdx.filter(x => passesFilters(x.s));

                document.getElementById('topCount').textContent = filtersActive() ?
                    `${String(visible.length).padStart(3,'0')} / ${String(statements.length).padStart(3,'0')}` :
                    String(statements.length).padStart(3, '0');

                if (visible.length === 0) {
                    root.appendChild(el(`
                <div class="hud-empty">
                  <div class="t-micro">NO MATCHES</div>
                  <p>No statements match these filters.</p>
                  <button class="btn ghost" id="clearFromEmpty">Clear filters</button>
                </div>
              `));
                    root.querySelector('#clearFromEmpty').addEventListener('click', clearFilters);
                    renderHud();
                    return;
                }

                const list = el('<div class="list"></div>');
                visible.forEach(({ s, idx }) => {
                    list.appendChild(renderGridItem(s, idx));
                });
                root.appendChild(list);
                populateAuthorSelects();
                renderHud();
            }

            function renderGridItem(s, idx) {
                const a = authorById(s.authorId);
                const item = el(`
              <div class="row grid-item" data-id="${s.id}">
                <div class="row-avatar">${avatarHtml(s.authorId,'sm')}</div>
                <div class="row-meta">
                  <span class="row-author">${a ? escapeHtml(a.name) : 'UNKNOWN'}${a && a.kind==='company' ? ' <span class="co-badge">CO</span>' : ''}</span>
                  <span class="row-time">${fmtTime(s.time)}</span>
                  ${s.tag ? `<span class="card-tag t-micro">${escapeHtml(s.tag)}</span>` : ''}
                </div>
                <div class="row-text">${escapeHtml(s.text)}</div>
                ${s.mediaUrl ? renderMediaGrid(s.mediaUrl) : ''}
                <div class="row-marker">${countReplies(s)} replies</div>
              </div>
            `);
                item.addEventListener('click', () => { openConversation(s.id); });
                return item;
            }

            // ── Filter UI Update ───────────────────────────────────────

            function updateFilterUI() {
                const count = activeTags.size + activeKinds.size + activeDisciplines.size + (searchQuery.length > 0 ? 1 : 0);
                document.getElementById('filterCount').textContent = count;
                const summary = document.getElementById('activeFilterSummary');
                if (count === 0) {
                    summary.textContent = 'No filters active';
                } else {
                    let parts = [];
                    if (searchQuery) parts.push(`"${searchQuery}"`);
                    if (activeTags.size > 0) parts.push(`${activeTags.size} tag${activeTags.size>1?'s':''}`);
                    if (activeKinds.size > 0) parts.push(`${activeKinds.size} kind${activeKinds.size>1?'s':''}`);
                    if (activeDisciplines.size > 0) parts.push(`${activeDisciplines.size} discipline${activeDisciplines.size>1?'s':''}`);
                    summary.textContent = `Active: ${parts.join(', ')}`;
                }
                document.getElementById('hudClear').hidden = count === 0;
            }

            // ── Bento Modal ────────────────────────────────────────────

            function openBento() {
                const overlay = document.getElementById('bentoOverlay');
                overlay.classList.add('open');
                populateBentoChips();
                document.getElementById('bentoSearch').value = searchQuery;
            }

            function closeBento() {
                document.getElementById('bentoOverlay').classList.remove('open');
            }

            function populateBentoChips() {
                // Tags
                const tagContainer = document.querySelector('#bentoTags .chip-group');
                const tagCounts = {};
                statements.forEach(s => { if (s.tag) tagCounts[s.tag] = (tagCounts[s.tag] || 0) + 1; });
                tagContainer.innerHTML = '';
                Object.keys(tagCounts).sort().forEach(tag => {
                    const chip = document.createElement('button');
                    chip.className = 'chip' + (activeTags.has(tag) ? ' active' : '');
                    chip.textContent = `${tag} (${tagCounts[tag]})`;
                    chip.dataset.type = 'tag';
                    chip.dataset.value = tag;
                    chip.addEventListener('click', () => {
                        if (activeTags.has(tag)) activeTags.delete(tag);
                        else activeTags.add(tag);
                        populateBentoChips();
                    });
                    tagContainer.appendChild(chip);
                });

                // People
                const peopleContainer = document.querySelector('#bentoPeople .chip-group');
                peopleContainer.innerHTML = '';
                authors.filter(a => a.kind === 'person').forEach(a => {
                    const chip = document.createElement('button');
                    const isActive = activeKinds.has(a.id);
                    chip.className = 'chip' + (isActive ? ' active' : '');
                    chip.textContent = a.name;
                    chip.dataset.type = 'person';
                    chip.dataset.value = a.id;
                    chip.addEventListener('click', () => {
                        if (activeKinds.has(a.id)) activeKinds.delete(a.id);
                        else activeKinds.add(a.id);
                        populateBentoChips();
                    });
                    peopleContainer.appendChild(chip);
                });

                // Companies
                const companiesContainer = document.querySelector('#bentoCompanies .chip-group');
                companiesContainer.innerHTML = '';
                authors.filter(a => a.kind === 'company').forEach(a => {
                    const chip = document.createElement('button');
                    const isActive = activeKinds.has(a.id);
                    chip.className = 'chip' + (isActive ? ' active' : '');
                    chip.textContent = a.name;
                    chip.dataset.type = 'company';
                    chip.dataset.value = a.id;
                    chip.addEventListener('click', () => {
                        if (activeKinds.has(a.id)) activeKinds.delete(a.id);
                        else activeKinds.add(a.id);
                        populateBentoChips();
                    });
                    companiesContainer.appendChild(chip);
                });

                // Disciplines
                const discContainer = document.querySelector('#bentoDisciplines .chip-group');
                const discCounts = {};
                authors.forEach(a => { if (a.discipline) discCounts[a.discipline] = (discCounts[a.discipline] || 0) + 1; });
                discContainer.innerHTML = '';
                Object.keys(discCounts).sort().forEach(d => {
                    const chip = document.createElement('button');
                    chip.className = 'chip' + (activeDisciplines.has(d) ? ' active' : '');
                    chip.textContent = `${d} (${discCounts[d]})`;
                    chip.dataset.type = 'discipline';
                    chip.dataset.value = d;
                    chip.addEventListener('click', () => {
                        if (activeDisciplines.has(d)) activeDisciplines.delete(d);
                        else activeDisciplines.add(d);
                        populateBentoChips();
                    });
                    discContainer.appendChild(chip);
                });
            }

            // ── composer ───────────────────────────────────────────────

            function populateAuthorSelects() {
                const sel = document.getElementById('c-author-select');
                if (!sel) return;
                sel.innerHTML = authorOptionsHtml();
                sel.value = lastAuthorId || authors[0].id;
            }

            function openComposer() {
                document.getElementById('composer').classList.add('open');
                populateAuthorSelects();
                document.getElementById('c-text').focus();
            }

            function closeComposer() {
                document.getElementById('composer').classList.remove('open');
                document.getElementById('c-tag').value = '';
                document.getElementById('c-media').value = '';
                document.getElementById('c-text').value = '';
                document.getElementById('newAuthorPanel').classList.remove('open');
            }

            function authorOptionsHtml() {
                const people = authors.filter(a => a.kind === 'person');
                const companies = authors.filter(a => a.kind === 'company');
                const opt = a => `<option value="${a.id}">${escapeHtml(a.name)}</option>`;
                return `<optgroup label="People">${people.map(opt).join('')}</optgroup><optgroup label="Companies">${companies.map(opt).join('')}</optgroup>`;
            }

            // ── init ────────────────────────────────────────────────────

            // Font & Scale controls (topbar)
            document.getElementById('fontSelect').addEventListener('change', function() {
                document.body.setAttribute('data-font', this.value);
            });

            document.querySelectorAll('.scale-group .chip').forEach(btn => {
                btn.addEventListener('click', () => {
                    const scale = btn.dataset.scale;
                    document.body.setAttribute('data-scale', scale);
                    document.querySelectorAll('.scale-group .chip').forEach(b => {
                        b.classList.toggle('active', b.dataset.scale === scale);
                    });
                });
            });

            // Grid toggle
            document.getElementById('toggleLayoutBtn').addEventListener('click', function() {
                gridMode = !gridMode;
                this.textContent = gridMode ? 'List' : 'Grid';
                document.body.classList.toggle('grid-mode');
                render();
            });

            // New post
            document.getElementById('newBtn').addEventListener('click', () => {
                const c = document.getElementById('composer');
                c.classList.contains('open') ? closeComposer() : openComposer();
            });
            document.getElementById('c-cancel').addEventListener('click', closeComposer);
            document.getElementById('c-post').addEventListener('click', () => {
                const authorId = document.getElementById('c-author-select').value;
                const tag = document.getElementById('c-tag').value.trim().toUpperCase();
                const mediaUrl = document.getElementById('c-media').value.trim();
                const text = document.getElementById('c-text').value.trim();
                if (!text || !authorId) return;
                lastAuthorId = authorId;
                statements.unshift({ id: uid(), authorId, time: Date.now(), tag, text, mediaUrl, replies: [] });
                saveData();
                closeComposer();
                render();
            });

            // New author
            document.getElementById('toggleNewAuthor').addEventListener('click', () => {
                document.getElementById('newAuthorPanel').classList.toggle('open');
            });
            document.querySelectorAll('input[name=na-kind]').forEach(r => {
                r.addEventListener('change', (e) => {
                    document.getElementById('na-role-label').textContent = e.target.value === 'company' ?
                        'Tagline' : 'Role';
                    document.getElementById('na-role').placeholder = e.target.value === 'company' ?
                        'Hiring: 2 product designers' : 'Creative Director';
                });
            });
            document.getElementById('na-save').addEventListener('click', () => {
                const name = document.getElementById('na-name').value.trim();
                if (!name) return;
                const kind = document.querySelector('input[name=na-kind]:checked').value;
                const role = document.getElementById('na-role').value.trim();
                const newAuthor = { id: uid(), kind, name, role: kind === 'person' ? role : (role || ''),
                    tagline: kind === 'company' ? role : '' };
                authors.push(newAuthor);
                saveData();
                populateAuthorSelects();
                document.getElementById('c-author-select').value = newAuthor.id;
                lastAuthorId = newAuthor.id;
                document.getElementById('na-name').value = '';
                document.getElementById('na-role').value = '';
                document.getElementById('newAuthorPanel').classList.remove('open');
            });

            // Reset
            document.getElementById('resetLink').addEventListener('click', async (e) => {
                e.preventDefault();
                authors = seedAuthors();
                statements = seedStatements(authors);
                modalReplyTargetId = null;
                collapsed.clear();
                lastAuthorId = null;
                clearFilters();
                await saveData();
                render();
            });

            // Bento modal controls
            document.getElementById('filterToggleBtn').addEventListener('click', openBento);
            document.getElementById('bentoClose').addEventListener('click', closeBento);
            document.getElementById('bentoOverlay').addEventListener('click', (e) => {
                if (e.target === e.currentTarget) closeBento();
            });
            document.getElementById('bentoClearAll').addEventListener('click', () => {
                clearFilters();
                populateBentoChips();
                closeBento();
            });
            document.getElementById('bentoApply').addEventListener('click', () => {
                const searchInput = document.getElementById('bentoSearch');
                searchQuery = searchInput.value.trim();
                closeBento();
                render();
            });

            document.getElementById('bentoSearch').addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    document.getElementById('bentoApply').click();
                }
            });

            document.getElementById('hudClear').addEventListener('click', clearFilters);

            document.getElementById('modalClose').addEventListener('click', closeConversation);
            document.getElementById('conversationModal').addEventListener('click', (e) => {
                if (e.target === e.currentTarget) closeConversation();
            });

            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') {
                    closeConversation();
                    if (!document.getElementById('profileModal').hidden) {
                        document.getElementById('profileModal').hidden = true;
                    }
                    if (document.getElementById('bentoOverlay').classList.contains('open')) {
                        closeBento();
                    }
                }
            });

            loadData().then(render);
        })();
    </script>
</body>
</html>
