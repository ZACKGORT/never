    <script>
        (function() {
            'use strict';

            // ── Constants ─────────────────────────────────────────────
            const STORAGE_KEY = 'neverever-statements-v9';
            const PAGE_SIZE = 12;
            const AVIF_IMAGES = [
                'https://images.unsplash.com/photo-1506744038136-46273834b3fb?fm=avif&w=800&h=450&fit=crop&q=80',
                'https://images.unsplash.com/photo-1496181133206-80ce9b88a853?fm=avif&w=800&h=450&fit=crop&q=80',
                'https://images.unsplash.com/photo-1485550409059-9afb054cada4?fm=avif&w=800&h=450&fit=crop&q=80',
                'https://images.unsplash.com/photo-1519681393784-d120267933ba?fm=avif&w=800&h=450&fit=crop&q=80',
                'https://images.unsplash.com/photo-1504384308090-c894fdcc538d?fm=avif&w=800&h=450&fit=crop&q=80'
            ];

            // ── Helpers ──────────────────────────────────────────────
            const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
            const hash = str => { let h = 0; for (let i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) >>> 0; return h; };
            const avatarVariant = id => 'v' + (hash(id) % 4);
            const initialsFor = a => {
                const parts = a.name.replace(/[^A-Za-z ]/g, '').trim().split(/\s+/).filter(Boolean);
                if (!parts.length) return '?';
                if (parts.length === 1) return parts[0].slice(0, 2).toUpperCase();
                return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
            };
            const authorById = id => authors.find(a => a.id === id);
            const randAVIF = () => AVIF_IMAGES[Math.floor(Math.random() * AVIF_IMAGES.length)];
            const isVideo = url => /\.(mp4|webm|mov)(\?|$)/i.test(url);
            const escapeHtml = s => (s || '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;',
                '"': '&quot;', "'": '&#39;' } [c]));

            function fmtTime(ts) {
                const d = new Date(ts),
                    now = new Date();
                const sameDay = d.toDateString() === now.toDateString();
                const yest = new Date(now);
                yest.setDate(now.getDate() - 1);
                const isYest = d.toDateString() === yest.toDateString();
                const hh = d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }).toUpperCase();
                if (sameDay) return 'TODAY ' + hh;
                if (isYest) return 'YESTERDAY';
                return d.toLocaleDateString([], { month: 'short', day: 'numeric' }).toUpperCase();
            }

            function countReplies(node) {
                let n = node.replies.length;
                node.replies.forEach(r => n += countReplies(r));
                return n;
            }

            function avatarHtml(authorId, size) {
                const a = authorById(authorId);
                if (!a) return `<div class="avatar sz-${size} v1">?</div>`;
                const cls = ['avatar', 'sz-' + size, avatarVariant(a.id)];
                if (a.kind === 'company') cls.push('company');
                return `<div class="${cls.join(' ')}">${escapeHtml(initialsFor(a))}</div>`;
            }

            function renderMediaThumb(url) {
                if (!url) return '';
                const tag = isVideo(url) ? 'video' : 'img';
                const attrs = isVideo(url) ? 'controls playsinline muted' : 'alt=""';
                return `<div class="thumb-sm"><${tag} src="${escapeHtml(url)}" ${attrs} loading="lazy" /></div>`;
            }

            function renderMediaHero(url) {
                if (!url) return '';
                const tag = isVideo(url) ? 'video' : 'img';
                const attrs = isVideo(url) ? 'controls playsinline' : 'alt=""';
                return `<div style="margin-top:0.3rem;border-radius:var(--radius-sm);overflow:hidden;background:var(--bg);border:1px solid var(--border);"><${tag} src="${escapeHtml(url)}" ${attrs} loading="lazy" style="display:block;width:100%;height:auto;max-height:200px;object-fit:cover;" /></div>`;
            }

            // ── Seed data ─────────────────────────────────────────────
            function seedAuthors() {
                return [
                    { id: 'zack', kind: 'person', discipline: 'DESIGN', name: 'Zack Gort',
                    role: 'Product / UX Designer', tagline: 'Six years freelance.' },
                    { id: 'maya', kind: 'person', discipline: 'DESIGN', name: 'Maya Chen', role: 'Creative Director',
                        tagline: 'Ex-agency.' },
                    { id: 'tom', kind: 'person', discipline: 'ENGINEERING', name: 'Tom Okafor', role: 'ML Engineer',
                        tagline: 'Infra and eval.' },
                    { id: 'ria', kind: 'person', discipline: 'BRAND', name: 'Ria Patel', role: 'Brand Strategist',
                        tagline: 'Naming, systems.' },
                    { id: 'dev', kind: 'person', discipline: 'ENGINEERING', name: 'Dev Singh',
                        role: 'Frontend Engineer', tagline: 'React / Swift.' },
                    { id: 'elena', kind: 'person', discipline: 'DESIGN', name: 'Elena Vogt', role: 'Design Director',
                        tagline: 'Design systems.' },
                    { id: 'james', kind: 'person', discipline: 'ENGINEERING', name: 'James Kwon',
                        role: 'Staff Engineer', tagline: 'Distributed systems.' },
                    { id: 'sophie', kind: 'person', discipline: 'BRAND', name: 'Sophie Laurent',
                        role: 'Brand Director', tagline: 'Finding voice.' },
                    { id: 'marco', kind: 'person', discipline: 'ENGINEERING', name: 'Marco Rossi',
                        role: 'VP Engineering', tagline: 'Scaled teams.' },
                    { id: 'aisha', kind: 'person', discipline: 'DESIGN', name: 'Aisha Okonkwo',
                        role: 'Product Designer', tagline: 'Fintech, healthtech.' },
                    { id: 'liam', kind: 'person', discipline: 'ENGINEERING', name: 'Liam O\'Brien',
                        role: 'DevOps Lead', tagline: 'Kubernetes.' },
                    { id: 'nina', kind: 'person', discipline: 'BRAND', name: 'Nina Chen', role: 'Creative Director',
                        tagline: 'Climate tech.' },
                    { id: 'peter', kind: 'person', discipline: 'DESIGN', name: 'Peter Malkin', role: 'Design Lead',
                        tagline: 'UX research.' },
                    { id: 'clara', kind: 'person', discipline: 'ENGINEERING', name: 'Clara Fischer',
                        role: 'Backend Engineer', tagline: 'Go, Rust.' },
                    { id: 'studio-north', kind: 'company', discipline: 'DESIGN', name: 'Studio North',
                        role: 'Design studio, 12 people', tagline: 'Systems-heavy.' },
                    { id: 'forge-labs', kind: 'company', discipline: 'ENGINEERING', name: 'Forge Labs',
                        role: 'Inference infra', tagline: 'Model deployment.' },
                    { id: 'hollow-co', kind: 'company', discipline: 'BRAND', name: 'Hollow & Co',
                        role: 'Branding agency', tagline: 'Portfolio reviews.' },
                    { id: 'strata', kind: 'company', discipline: 'ENGINEERING', name: 'Strata',
                        role: 'Cloud infrastructure', tagline: 'Multi-cloud.' },
                    { id: 'fieldwork', kind: 'company', discipline: 'DESIGN', name: 'Fieldwork',
                        role: 'Product design consultancy', tagline: 'Founders.' },
                    { id: 'catalyst', kind: 'company', discipline: 'BRAND', name: 'Catalyst',
                        role: 'Brand + comms', tagline: 'Say something real.' }
                ];
            }

            function seedStatements(authorsList) {
                const now = Date.now(),
                    day = 24 * 60 * 60 * 1000;
                const texts = [
                    'Looking for staff-level product work. Six years freelance, shipped 20+ products.',
                    'Left my agency job today. No regrets yet — ask me in a month.',
                    'A staff title means nothing if the team around it is broken.',
                    'Rebranded three companies this year. None needed it.',
                    'Design systems are not about consistency. They\'re about enabling speed.',
                    'Distributed systems are hard because we\'re trying to make unreliable things reliable.',
                    'Your brand isn\'t your logo. It\'s what people say about you when you\'re not in the room.',
                    'Leadership is about creating conditions for others to succeed.',
                    'I care about the details that make products feel human.',
                    'Observability isn\'t about dashboards. It\'s about answering questions you didn\'t know you\'d need to ask.',
                    'Go is the best programming language for infrastructure work.',
                    'Building inference tooling for teams shipping models to production.',
                    'Senior Product Designer. Remote-first. We build systems for regulated industries.',
                    'Free brand strategy workshop next week. 2 hours, 20 people max.',
                    'Portfolio reviews back. Every Friday, 5 portfolios, honest feedback.',
                    'The real system is the culture around it.',
                    'Best systems I\'ve built had failure as first-class concern.',
                    'UX researcher + product designer, 8 years. Looking for role where research drives decisions.',
                    'If you\'re in climate tech and hiring — please post roles here.'
                ];
                const tags = ['OPEN TO WORK', 'HIRING', 'CAREER', 'THOUGHTS', 'BRAND', 'COMMUNITY', 'LEADERSHIP'];
                const result = [];
                for (let i = 0; i < 24; i++) {
                    const a = authorsList[Math.floor(Math.random() * authorsList.length)];
                    result.push({
                        id: uid(),
                        authorId: a.id,
                        time: now - (Math.random() * 14 * day),
                        tag: tags[Math.floor(Math.random() * tags.length)],
                        text: texts[i % texts.length],
                        mediaUrl: Math.random() > 0.6 ? randAVIF() : '',
                        replies: []
                    });
                }
                return result;
            }

            // ── Storage ──────────────────────────────────────────────
            const storage = {
                get: async key => { try { const v = localStorage.getItem(key); return v !== null ? { value: v } : null; }
                    catch (e) { return null; } },
                set: async (key, val) => { try { localStorage.setItem(key, val); return true; } catch (e) { return false; } }
            };

            // ── State ─────────────────────────────────────────────────
            let authors = [];
            let statements = [];
            let letterData = [];
            let activeIndex = 0;
            let focusMode = false;
            let modalStatementId = null;
            let modalReplyTargetId = null;
            const collapsed = new Set();
            const activeTags = new Set();
            const activeKinds = new Set();
            const activeDisciplines = new Set();
            let searchQuery = '';

            // ── Data loading ──────────────────────────────────────────
            async function loadData() {
                try {
                    const res = await storage.get(STORAGE_KEY);
                    if (res && res.value) {
                        const parsed = JSON.parse(res.value);
                        if (parsed.authors?.length && parsed.statements?.length) {
                            authors = parsed.authors;
                            statements = parsed.statements;
                            return;
                        }
                    }
                } catch (e) {}
                authors = seedAuthors();
                statements = seedStatements(authors);
                await saveData();
            }

            let saveInFlight = false;

            function setSaveStatus(state) {
                const el = document.getElementById('saveStatus');
                if (!el) return;
                el.classList.remove('err', 'ok');
                if (state === 'saving') el.textContent = '· saving…';
                else if (state === 'ok') { el.textContent = '· saved';
                    el.classList.add('ok'); } else if (state === 'err') { el.textContent = '· not saved';
                    el.classList.add('err'); } else { el.textContent = ''; }
            }

            async function saveData() {
                if (saveInFlight) return;
                saveInFlight = true;
                setSaveStatus('saving');
                try {
                    await storage.set(STORAGE_KEY, JSON.stringify({ authors, statements }));
                    setSaveStatus('ok');
                } catch (e) { setSaveStatus('err'); }
                saveInFlight = false;
            }

            // ── DEV: wipe saved statements and reseed fresh demo content ──
            // Console: resetDemoContent()
            // URL, once: yourfile.html?reset-demo
            async function resetDemoContent() {
                try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
                authors = seedAuthors();
                statements = seedStatements(authors);
                await saveData();
                activeIndex = 0;
                renderTrack();
                console.log('resetDemoContent: reseeded', authors.length, 'authors /', statements.length, 'statements');
            }
            window.resetDemoContent = resetDemoContent;

            // ── Filters ──────────────────────────────────────────────
            function passesFilters(s) {
                const a = authorById(s.authorId);
                if (!a) return false;
                if (searchQuery) {
                    const q = searchQuery.toLowerCase();
                    if (!s.text.toLowerCase().includes(q) && !a.name.toLowerCase().includes(q) && !(s.tag && s.tag
                            .toLowerCase().includes(q))) return false;
                }
                const tagOk = activeTags.size === 0 || (s.tag && activeTags.has(s.tag));
                const kindOk = activeKinds.size === 0 || activeKinds.has(a.kind);
                const discOk = activeDisciplines.size === 0 || activeDisciplines.has(a.discipline);
                return tagOk && kindOk && discOk;
            }

            function getFiltered() { return statements.filter(passesFilters); }

            function filtersActive() {
                return activeTags.size > 0 || activeKinds.size > 0 || activeDisciplines.size > 0 || searchQuery.length > 0;
            }

            function clearFilters() {
                activeTags.clear();
                activeKinds.clear();
                activeDisciplines.clear();
                searchQuery = '';
                document.getElementById('bentoSearch').value = '';
                renderLetter(activeIndex);
                updateFilterUI();
            }

            function updateFilterUI() {
                const count = activeTags.size + activeKinds.size + activeDisciplines.size + (searchQuery.length > 0 ? 1 :
                0);
                document.getElementById('filterCount').textContent = count;
                const summary = document.getElementById('activeFilterSummary');
                if (count === 0) summary.textContent = 'No filters active';
                else {
                    const parts = [];
                    if (searchQuery) parts.push(`"${searchQuery}"`);
                    if (activeTags.size) parts.push(`${activeTags.size} tag${activeTags.size>1?'s':''}`);
                    if (activeKinds.size) parts.push(`${activeKinds.size} kind${activeKinds.size>1?'s':''}`);
                    if (activeDisciplines.size) parts.push(`${activeDisciplines.size} discipline${activeDisciplines.size>1?'s':''}`);
                    summary.textContent = `Active: ${parts.join(', ')}`;
                }
                document.getElementById('hudClear').hidden = count === 0;
            }

            // ── Conversation modal ───────────────────────────────────
            function openConversation(id) {
                modalStatementId = id;
                modalReplyTargetId = null;
                document.getElementById('conversationModal').classList.add('open');
                document.body.style.overflow = 'hidden';
                renderModalContent(id);
            }

            function closeConversation() {
                document.getElementById('conversationModal').classList.remove('open');
                document.body.style.overflow = '';
                modalStatementId = null;
                modalReplyTargetId = null;
            }

            function renderModalNode(node, statement, depth) {
                const hasChildren = node.replies.length > 0;
                const isCollapsed = collapsed.has(node.id);
                const a = authorById(node.authorId);
                const wrap = document.createElement('div');
                wrap.className = 'modal-node';
                wrap.dataset.nodeId = node.id;

                let headHtml =
                    `
              <div class="modal-node-head">
                ${hasChildren ? `<button class="modal-node-toggle" data-node-id="${node.id}">${isCollapsed ? '[+]' : '[–]'}</button>` : ''}
                ${avatarHtml(node.authorId,'xs')}
                <span class="modal-node-author" data-author-id="${node.authorId}">${a ? escapeHtml(a.name) : 'UNKNOWN'}</span>
                ${a && a.kind==='company' ? '<span class="co-badge" style="font-family:var(--font-mono);font-size:6px;color:var(--ink-light);border:1px solid var(--border);padding:0 3px;border-radius:2px;">CO</span>' : ''}
                <span class="modal-node-time">${fmtTime(node.time)}</span>
                ${isCollapsed ? `<span style="font-family:var(--font-mono);font-size:8px;color:var(--ink-light);">(${countReplies(node)+1} hidden)</span>` : ''}
              </div>
            `;
                wrap.innerHTML = headHtml;

                const head = wrap.querySelector('.modal-node-head');
                head.querySelector('[data-author-id]').addEventListener('click', e => e.stopPropagation());

                if (hasChildren) {
                    const toggle = head.querySelector('.modal-node-toggle');
                    toggle.addEventListener('click', e => {
                        e.stopPropagation();
                        isCollapsed ? collapsed.delete(node.id) : collapsed.add(node.id);
                        renderModalContent(modalStatementId);
                    });
                }

                if (!isCollapsed) {
                    const textDiv = document.createElement('div');
                    textDiv.className = 'modal-node-text';
                    textDiv.textContent = node.text;
                    wrap.appendChild(textDiv);

                    const actions = document.createElement('div');
                    actions.className = 'modal-node-actions';
                    const replyBtn = document.createElement('button');
                    replyBtn.className = 'modal-node-link';
                    replyBtn.textContent = 'reply';
                    replyBtn.addEventListener('click', () => {
                        modalReplyTargetId = (modalReplyTargetId === node.id) ? null : node.id;
                        renderModalContent(modalStatementId);
                    });
                    actions.appendChild(replyBtn);
                    wrap.appendChild(actions);

                    if (modalReplyTargetId === node.id) {
                        const form = renderModalReplyForm(node);
                        wrap.appendChild(form);
                    }

                    if (node.replies.length) {
                        const childWrap = document.createElement('div');
                        childWrap.className = 'modal-node-children';
                        node.replies.forEach(child => childWrap.appendChild(renderModalNode(child, statement, (depth ||
                            0) + 1)));
                        wrap.appendChild(childWrap);
                    }
                }
                return wrap;
            }

            function renderModalReplyForm(target) {
                const form = document.createElement('div');
                form.className = 'modal-reply-form';
                const sel = document.createElement('select');
                sel.className = 'rf-author';
                sel.innerHTML = authorOptionsHtml();
                sel.value = authors[0]?.id || '';

                const ta = document.createElement('textarea');
                ta.className = 'rf-text';
                ta.placeholder = 'Write a reply…';
                ta.style.minHeight = '50px';

                const actions = document.createElement('div');
                actions.className = 'composer-actions';

                const cancelBtn = document.createElement('button');
                cancelBtn.className = 'btn ghost small';
                cancelBtn.textContent = 'Cancel';
                cancelBtn.addEventListener('click', () => {
                    modalReplyTargetId = null;
                    renderModalContent(modalStatementId);
                });

                const submitBtn = document.createElement('button');
                submitBtn.className = 'btn btn-primary small';
                submitBtn.textContent = 'Post reply';
                submitBtn.addEventListener('click', () => {
                    const authorId = sel.value;
                    const text = ta.value.trim();
                    if (!text || !authorId) return;
                    target.replies.push({ id: uid(), authorId, time: Date.now(), text, replies: [] });
                    modalReplyTargetId = null;
                    saveData();
                    renderModalContent(modalStatementId);
                    renderLetter(activeIndex);
                });

                actions.appendChild(cancelBtn);
                actions.appendChild(submitBtn);
                form.appendChild(sel);
                form.appendChild(ta);
                form.appendChild(actions);
                return form;
            }

            function renderModalContent(id) {
                const s = statements.find(st => st.id === id);
                if (!s) return;
                const container = document.getElementById('modalContent');
                const a = authorById(s.authorId);

                let html =
                    `
              <div class="modal-statement">
                <div class="card-who">
                  ${avatarHtml(s.authorId,'md')}
                  <div>
                    <div class="card-author-row">
                      <span class="card-author" data-author-id="${s.authorId}">${a ? escapeHtml(a.name) : 'UNKNOWN'}</span>
                      ${a && a.kind==='company' ? '<span class="co-badge" style="font-family:var(--font-mono);font-size:6px;color:var(--ink-light);border:1px solid var(--border);padding:0 3px;border-radius:2px;">CO</span>' : ''}
                      <span class="card-time">${fmtTime(s.time)}</span>
                      ${s.tag ? `<span class="card-tag" style="font-family:var(--font-mono);font-size:8px;color:var(--ink-light);border:1px solid var(--border);padding:0 6px;border-radius:var(--radius-sm);letter-spacing:0.04em;">${escapeHtml(s.tag)}</span>` : ''}
                    </div>
                    <div class="card-role">${a ? escapeHtml(a.role||'') : ''}</div>
                  </div>
                </div>
                ${renderMediaHero(s.mediaUrl)}
                <div class="card-text">${escapeHtml(s.text)}</div>
              </div>
              <div class="t-micro" style="margin-bottom:10px;">REPLIES (${countReplies(s)})</div>
              <div class="modal-thread" id="modalThread"></div>
              <div class="modal-reply-trigger" id="modalReplyTrigger"></div>
            `;

                container.innerHTML = html;

                const threadEl = container.querySelector('#modalThread');
                s.replies.forEach(r => threadEl.appendChild(renderModalNode(r, s, 0)));

                const trigger = container.querySelector('#modalReplyTrigger');
                const link = document.createElement('button');
                link.className = 'modal-node-link';
                link.textContent = '+ reply to this statement';
                link.addEventListener('click', () => {
                    modalReplyTargetId = (modalReplyTargetId === s.id) ? null : s.id;
                    renderModalContent(modalStatementId);
                });
                trigger.appendChild(link);

                if (modalReplyTargetId === s.id) {
                    trigger.appendChild(renderModalReplyForm(s));
                }
            }

            // ── Bento card builder ───────────────────────────────────
            function buildBentoCard(s) {
                const a = authorById(s.authorId);
                const variants = ['card-white', 'card-light', 'card-dark', 'card-mid', 'card-accent', 'card-accent-2'];
                const variant = variants[Math.floor(Math.random() * variants.length)];
                let spans = '';
                const r = Math.random();
                if (r < 0.2) spans = 'span-2';
                else if (r < 0.3) spans = 'row-span-2';

                const card = document.createElement('div');
                card.className = ['card', variant, spans].filter(Boolean).join(' ');
                card.style.animationDelay = (Math.random() * 0.2) + 's';

                const isDark = variant.includes('dark') || variant.includes('mid');
                const textColor = isDark ? '#fff' : 'var(--ink)';
                const lightColor = isDark ? 'rgba(255,255,255,0.6)' : 'var(--ink-light)';
                const bodyColor = isDark ? 'rgba(255,255,255,0.8)' : 'var(--ink-mid)';
                const metaColor = isDark ? 'rgba(255,255,255,0.4)' : 'var(--ink-light)';

                card.innerHTML = `
              <div>
                <div class="label-sm">${escapeHtml(s.tag || 'STATEMENT')}</div>
                <div class="display-sm" style="font-weight:600;margin-top:0.15rem;color:${textColor};">${escapeHtml(a ? a.name : 'Unknown')}</div>
                ${a?.role ? `<div class="body-xs" style="color:${lightColor};">${escapeHtml(a.role)}</div>` : ''}
              </div>
              <div class="mt-auto">
                <p class="body-sm" style="max-width:30ch;margin-top:0.2rem;color:${bodyColor};">${escapeHtml(s.text)}</p>
                ${s.mediaUrl ? `<div style="margin-top:0.4rem;border-radius:var(--radius-sm);overflow:hidden;background:var(--bg);border:1px solid var(--border);max-height:80px;"><img src="${escapeHtml(s.mediaUrl)}" alt="" style="display:block;width:100%;height:auto;object-fit:cover;" loading="lazy" /></div>` : ''}
                <div class="label-xs" style="margin-top:0.3rem;color:${metaColor};">${fmtTime(s.time)} · ${countReplies(s)} repl${countReplies(s)===1?'y':'ies'}</div>
              </div>
              ${isDark ? `<div class="hex-row" style="margin-top:0.15rem;"><span>✦</span><span>✧</span><span>✦</span><span>✧</span><span>✦</span></div>` :
              variant.includes('accent') ? `<div class="dot-grid" style="margin-top:0.15rem;"><span class="dot" style="background:#1C1C1E;"></span><span class="dot" style="background:#1C1C1E;opacity:0.6;"></span><span class="dot" style="background:#1C1C1E;opacity:0.3;"></span><span class="dot" style="background:#1C1C1E;opacity:0.1;"></span></div>` :
              `<div class="icon-row" style="margin-top:0.15rem;"><span>◈</span><span>◇</span><span>◈</span></div>`}
            `;

                card.addEventListener('click', () => openConversation(s.id));
                return card;
            }

            // ── Item builders (list, grid) ───────────────────────────
            function buildRow(s, idx) {
                const a = authorById(s.authorId);
                const row = document.createElement('div');
                row.className = 'letter-row';
                row.dataset.id = s.id;
                row.innerHTML =
                    `
              <div class="letter-row-idx t-data">${idx}</div>
              <div class="letter-row-avatar">${avatarHtml(s.authorId,'sm')}</div>
              <div class="letter-row-text-wrap">
                <div class="letter-row-meta">
                  <span class="letter-row-author">${a ? escapeHtml(a.name) : 'UNKNOWN'}${a && a.kind==='company' ? ' <span class="co-badge">CO</span>' : ''}</span>
                  <span class="letter-row-time">${fmtTime(s.time)}</span>
                  ${s.tag ? `<span style="font-family:var(--font-mono);font-size:6px;color:var(--ink-light);border:1px solid var(--border);padding:0 4px;border-radius:2px;">${escapeHtml(s.tag)}</span>` : ''}
                </div>
                <div class="letter-row-text">${escapeHtml(s.text)}</div>
              </div>
              <div class="letter-row-marker">
                ${s.mediaUrl ? renderMediaThumb(s.mediaUrl) : ''}
                ${countReplies(s)} replies
              </div>
            `;
                row.addEventListener('click', () => openConversation(s.id));
                return row;
            }

            function buildGridItem(s) {
                const a = authorById(s.authorId);
                const item = document.createElement('div');
                item.className = 'grid-item';
                item.dataset.id = s.id;
                item.innerHTML =
                    `
              <div class="grid-top">
                ${avatarHtml(s.authorId,'sm')}
                <div class="grid-meta">
                  <span class="grid-author">${a ? escapeHtml(a.name) : 'UNKNOWN'}${a && a.kind==='company' ? ' <span class="co-badge">CO</span>' : ''}</span>
                  <span class="grid-time">${fmtTime(s.time)}</span>
                </div>
              </div>
              ${s.mediaUrl ? `<div class="thumb-grid"><img src="${escapeHtml(s.mediaUrl)}" alt="" loading="lazy" /></div>` : ''}
              <div class="grid-text">${escapeHtml(s.text)}</div>
              <div class="grid-footer">
                <span>${countReplies(s)} replies</span>
                ${s.tag ? `<span class="grid-tag" style="font-family:var(--font-mono);font-size:6px;letter-spacing:0.06em;text-transform:uppercase;color:var(--ink-light);border:1px solid var(--border);padding:1px 8px;border-radius:var(--radius-sm);">${escapeHtml(s.tag)}</span>` : ''}
              </div>
            `;
                item.addEventListener('click', () => openConversation(s.id));
                return item;
            }

            // ── Rendering ─────────────────────────────────────────────
            function renderLetter(index) {
                const panels = document.querySelectorAll('.letter-panel');
                if (!panels.length) return;
                const panel = panels[index];
                if (!panel) return;
                const data = letterData[index];
                if (!data) return;

                const frame = panel.querySelector('.letter-card-frame');
                if (!frame) return;

                // Update cover
                const cover = frame.querySelector('.letter-cover');
                if (cover) {
                    const kicker = cover.querySelector('.letter-cover-kicker');
                    const title = cover.querySelector('.letter-cover-name');
                    const deck = cover.querySelector('.letter-cover-deck');
                    if (kicker) kicker.textContent = 'LETTER ' + String(index + 1).padStart(2, '0');
                    if (title) title.textContent = data.title || 'Untitled letter';
                    if (deck) deck.textContent = data.deck || '';
                }

                // Update toolbar
                const toolbar = frame.querySelector('.letter-toolbar');
                const mode = data.viewMode || 'list';
                const filtered = getFiltered();

                const toggle = toolbar?.querySelector('.view-toggle');
                if (toggle) {
                    ['list', 'grid', 'bento'].forEach(m => {
                        const btn = toggle.querySelector(`[data-mode="${m}"]`);
                        if (btn) btn.classList.toggle('active', m === mode);
                    });
                }

                const countEl = toolbar?.querySelector('.letter-count');
                if (countEl) countEl.textContent = filtered.length + ' statements';

                // Remove old content
                const oldContent = frame.querySelector('.letter-content');
                if (oldContent) oldContent.remove();

                const content = document.createElement('div');
                content.className = 'letter-content';

                if (filtered.length === 0) {
                    content.innerHTML =
                        `
                    <div class="empty-letter">
                      <div class="t-micro">NO STATEMENTS</div>
                      <p>Nothing matches these filters.</p>
                      <button class="btn ghost small" onclick="window.__clearFilters()" style="margin-top:8px;">Clear filters</button>
                    </div>
                  `;
                } else {
                    const container = document.createElement('div');
                    container.className = mode === 'list' ? 'letter-list' : mode === 'grid' ? 'letter-grid' :
                        'letter-bento';

                    const endIdx = Math.min(PAGE_SIZE, filtered.length);
                    for (let i = 0; i < endIdx; i++) {
                        const s = filtered[i];
                        const idx = String(statements.length - statements.indexOf(s)).padStart(3, '0');
                        const el = mode === 'list' ? buildRow(s, idx) : mode === 'grid' ? buildGridItem(s) :
                            buildBentoCard(s);
                        container.appendChild(el);
                    }
                    content.appendChild(container);

                    if (filtered.length > PAGE_SIZE) {
                        const trigger = document.createElement('div');
                        trigger.className = 'load-more-trigger';
                        trigger.textContent = `Load more (${filtered.length - PAGE_SIZE} remaining)`;
                        trigger.addEventListener('click', () => {
                            const currentCount = container.querySelectorAll(
                                mode === 'list' ? '.letter-row' : mode === 'grid' ? '.grid-item' : '.card')
                                .length;
                            const nextBatch = Math.min(currentCount + PAGE_SIZE, filtered.length);
                            for (let i = currentCount; i < nextBatch; i++) {
                                const s = filtered[i];
                                const idx = String(statements.length - statements.indexOf(s)).padStart(3,
                                '0');
                                const el = mode === 'list' ? buildRow(s, idx) : mode === 'grid' ?
                                    buildGridItem(s) : buildBentoCard(s);
                                container.appendChild(el);
                            }
                            if (nextBatch >= filtered.length) {
                                trigger.textContent = 'All loaded ✓';
                                trigger.style.cursor = 'default';
                            } else {
                                trigger.textContent = `Load more (${filtered.length - nextBatch} remaining)`;
                            }
                        });
                        content.appendChild(trigger);
                    }
                }

                frame.appendChild(content);

                // Update UI
                document.getElementById('topCount').textContent = String(statements.length).padStart(3, '0');
                document.getElementById('hudPosition').textContent = (index + 1) + ' / ' + letterData.length;
                updateFilterUI();

                // Update HUD view buttons
                ['hudViewList', 'hudViewGrid', 'hudViewBento'].forEach(id => {
                    const btn = document.getElementById(id);
                    if (btn) btn.classList.toggle('active', id === 'hudView' + mode.charAt(0).toUpperCase() + mode
                        .slice(1));
                });
            }

            // ── Letter panel building ────────────────────────────────
            function buildLetterPanel(index, data) {
                const panel = document.createElement('div');
                panel.className = 'letter-panel' + (index === 0 ? ' active' : '');
                panel.dataset.index = String(index);

                const inner = document.createElement('div');
                inner.className = 'letter-panel-inner';

                const frame = document.createElement('div');
                frame.className = 'letter-card-frame';

                // Focus toggle
                const focusBtn = document.createElement('button');
                focusBtn.className = 'letter-card-focus-toggle';
                focusBtn.textContent = 'Focus';
                focusBtn.addEventListener('click', e => {
                    e.stopPropagation();
                    setFocusMode(!focusMode);
                });
                frame.appendChild(focusBtn);

                // Cover
                const cover = document.createElement('div');
                cover.className = 'letter-cover';
                cover.innerHTML = `
              <span class="letter-cover-kicker">LETTER ${String(index + 1).padStart(2, '0')}</span>
              <h2 class="letter-cover-name">${escapeHtml(data.title || 'Untitled letter')}</h2>
              <p class="letter-cover-deck">${escapeHtml(data.deck || '')}</p>
            `;
                frame.appendChild(cover);

                // Toolbar
                const toolbar = document.createElement('div');
                toolbar.className = 'letter-toolbar';
                const toggle = document.createElement('div');
                toggle.className = 'view-toggle';
                ['list', 'grid', 'bento'].forEach(m => {
                    const btn = document.createElement('button');
                    btn.className = 'chip' + (m === (data.viewMode || 'list') ? ' active' : '');
                    btn.dataset.mode = m;
                    btn.textContent = m.charAt(0).toUpperCase() + m.slice(1);
                    btn.addEventListener('click', e => {
                        e.stopPropagation();
                        data.viewMode = m;
                        renderLetter(index);
                    });
                    toggle.appendChild(btn);
                });
                toolbar.appendChild(toggle);

                const countEl = document.createElement('span');
                countEl.className = 'letter-count';
                countEl.textContent = '0 statements';
                toolbar.appendChild(countEl);
                frame.appendChild(toolbar);

                // Content
                const content = document.createElement('div');
                content.className = 'letter-content';
                frame.appendChild(content);

                inner.appendChild(frame);
                panel.appendChild(inner);

                panel.addEventListener('click', () => {
                    const idx = Number(panel.dataset.index);
                    if (idx !== activeIndex) activatePanel(idx);
                });

                return panel;
            }

            // ── Carousel ──────────────────────────────────────────────
            function renderTrack() {
                const track = document.getElementById('lettersTrack');
                track.innerHTML = '';
                letterData.forEach((data, i) => track.appendChild(buildLetterPanel(i, data)));
                renderLetter(0);
            }

            function activatePanel(newIndex) {
                if (newIndex < 0) newIndex = letterData.length - 1;
                if (newIndex >= letterData.length) newIndex = 0;
                if (newIndex === activeIndex) { scrollToPanel(newIndex); return; }

                const panels = document.querySelectorAll('.letter-panel');
                panels.forEach(p => p.classList.remove('active'));
                activeIndex = newIndex;
                panels[activeIndex].classList.add('active');
                renderLetter(activeIndex);
                scrollToPanel(activeIndex);
            }

            function scrollToPanel(index) {
                const panel = document.querySelectorAll('.letter-panel')[index];
                if (!panel) return;
                const track = document.getElementById('lettersTrack');
                const trackRect = track.getBoundingClientRect();
                const panelRect = panel.getBoundingClientRect();
                const delta = (panelRect.left + panelRect.width / 2) - (trackRect.left + trackRect.width / 2);
                track.scrollTo({ left: track.scrollLeft + delta, behavior: 'smooth' });
            }

            function setFocusMode(on) {
                focusMode = on;
                document.body.classList.toggle('focus-mode', on);
                document.getElementById('lettersTrack').classList.toggle('focus-mode', on);
                const btn = document.querySelector('.letter-card-focus-toggle');
                if (btn) {
                    btn.classList.toggle('active', on);
                    btn.textContent = on ? 'Exit focus' : 'Focus';
                }
            }

            // ── Composer ──────────────────────────────────────────────
            function authorOptionsHtml() {
                const people = authors.filter(a => a.kind === 'person');
                const companies = authors.filter(a => a.kind === 'company');
                const opt = a => `<option value="${a.id}">${escapeHtml(a.name)}</option>`;
                return `<optgroup label="People">${people.map(opt).join('')}</optgroup><optgroup label="Companies">${companies.map(opt).join('')}</optgroup>`;
            }

            function populateAuthorSelects() {
                const sel = document.getElementById('c-author-select');
                if (!sel) return;
                sel.innerHTML = authorOptionsHtml();
                sel.value = authors[0]?.id || '';
            }

            function openComposer() {
                document.getElementById('composer').classList.add('open');
                populateAuthorSelects();
                document.getElementById('c-text').focus();
            }

            function closeComposer() {
                document.getElementById('composer').classList.remove('open');
                document.getElementById('c-tag').value = '';
                document.getElementById('c-media').value = '';
                document.getElementById('c-text').value = '';
            }

            // Drag the composer by its header. Position persists across
            // close/reopen (same DOM node, inline style just stays put)
            // and across navigation — dragging never touches .open, so
            // moving the window doesn't close it or block anything behind it.
            function setupComposerDrag() {
                const composer = document.getElementById('composer');
                const header = document.getElementById('composerHeader');
                if (!composer || !header) return;
                let dragging = false,
                    offsetX = 0,
                    offsetY = 0;

                header.addEventListener('pointerdown', (e) => {
                    if (e.target.closest('.composer-close')) return;
                    const rect = composer.getBoundingClientRect();
                    composer.style.left = rect.left + 'px';
                    composer.style.top = rect.top + 'px';
                    composer.style.right = 'auto';
                    composer.style.bottom = 'auto';
                    offsetX = e.clientX - rect.left;
                    offsetY = e.clientY - rect.top;
                    dragging = true;
                    composer.classList.add('dragging');
                    header.setPointerCapture(e.pointerId);
                });
                header.addEventListener('pointermove', (e) => {
                    if (!dragging) return;
                    const maxX = Math.max(8, window.innerWidth - composer.offsetWidth - 8);
                    const maxY = Math.max(8, window.innerHeight - composer.offsetHeight - 8);
                    const x = Math.min(Math.max(8, e.clientX - offsetX), maxX);
                    const y = Math.min(Math.max(8, e.clientY - offsetY), maxY);
                    composer.style.left = x + 'px';
                    composer.style.top = y + 'px';
                });
                const endDrag = () => {
                    dragging = false;
                    composer.classList.remove('dragging');
                };
                header.addEventListener('pointerup', endDrag);
                header.addEventListener('pointercancel', endDrag);

                // Keep the window on-screen if the viewport shrinks (e.g. rotation).
                window.addEventListener('resize', () => {
                    if (composer.style.left === '' || composer.style.top === '') return;
                    const maxX = Math.max(8, window.innerWidth - composer.offsetWidth - 8);
                    const maxY = Math.max(8, window.innerHeight - composer.offsetHeight - 8);
                    composer.style.left = Math.min(parseFloat(composer.style.left), maxX) + 'px';
                    composer.style.top = Math.min(parseFloat(composer.style.top), maxY) + 'px';
                });
            }

            // ── Filter modal ──────────────────────────────────────────
            function openBento() {
                document.getElementById('bentoOverlay').classList.add('open');
                populateBentoChips();
                document.getElementById('bentoSearch').value = searchQuery;
                document.body.style.overflow = 'hidden';
            }

            function closeBento() {
                document.getElementById('bentoOverlay').classList.remove('open');
                document.body.style.overflow = '';
            }

            function populateBentoChips() {
                const sections = [
                    { id: 'bentoTags', items: statements.reduce((acc, s) => { if (s.tag) acc[s.tag] = (acc[s.tag] ||
                            0) + 1; return acc; }, {}), type: 'tag', active: activeTags },
                    { id: 'bentoPeople', items: authors.filter(a => a.kind === 'person'), type: 'person',
                    active: activeKinds },
                    { id: 'bentoCompanies', items: authors.filter(a => a.kind === 'company'), type: 'company',
                        active: activeKinds },
                    { id: 'bentoDisciplines', items: authors.reduce((acc, a) => { if (a.discipline) acc[a.discipline] = (
                            acc[a.discipline] || 0) + 1; return acc; }, {}), type: 'discipline',
                    active: activeDisciplines }
                ];

                sections.forEach(section => {
                    const container = document.querySelector(`#${section.id} .chip-group`);
                    if (!container) return;
                    container.innerHTML = '';
                    const entries = typeof section.items === 'object' && !Array.isArray(section.items) ?
                        Object.entries(section.items) :
                        section.items.map(a => [a.id, a.name]);
                    entries.sort((a, b) => a[1].localeCompare(b[1]));
                    entries.forEach(([key, label]) => {
                        const chip = document.createElement('button');
                        const isActive = section.active.has(key);
                        chip.className = 'chip' + (isActive ? ' active' : '');
                        const count = typeof section.items === 'object' && !Array.isArray(section.items) ?
                            ` (${section.items[key]})` :
                            '';
                        chip.textContent = label + count;
                        chip.addEventListener('click', () => {
                            if (section.active.has(key)) section.active.delete(key);
                            else section.active.add(key);
                            populateBentoChips();
                        });
                        container.appendChild(chip);
                    });
                });
            }

            // ── Init ──────────────────────────────────────────────────
            window.__clearFilters = clearFilters;

            document.addEventListener('DOMContentLoaded', async function() {
              try {
                // Font & scale
                document.getElementById('fontSelect').addEventListener('change', function() {
                    document.body.setAttribute('data-font', this.value);
                });
                document.querySelectorAll('.scale-group .chip').forEach(btn => {
                    btn.addEventListener('click', () => {
                        const scale = btn.dataset.scale;
                        document.body.setAttribute('data-scale', scale);
                        document.querySelectorAll('.scale-group .chip').forEach(b => {
                            b.classList.toggle('active', b.dataset.scale === scale);
                        });
                    });
                });

                // Load data
                await loadData();
                if (new URLSearchParams(location.search).has('reset-demo')) {
                    await resetDemoContent();
                }

                // Letter data
                letterData = [
                    { title: 'The Feed', deck: 'All statements, unfiltered.', viewMode: 'bento' },
                    { title: 'Open to Work', deck: 'People looking for their next role.', viewMode: 'list' },
                    { title: 'Hiring', deck: 'Companies and teams looking for talent.', viewMode: 'list' },
                    { title: 'Thoughts', deck: 'Ideas, observations, provocations.', viewMode: 'grid' }
                ];

                // Build track
                renderTrack();

                // ─── HUD controls ─────────────────────────────────────
                // Navigation
                document.getElementById('hudPrev').addEventListener('click', () => activatePanel(activeIndex - 1));
                document.getElementById('hudNext').addEventListener('click', () => activatePanel(activeIndex + 1));
                document.getElementById('letterHotspotPrev').addEventListener('click', () => activatePanel(activeIndex - 1));
                document.getElementById('letterHotspotNext').addEventListener('click', () => activatePanel(activeIndex + 1));
                document.getElementById('focusExitBtn').addEventListener('click', () => setFocusMode(false));

                // View mode
                document.getElementById('hudViewList').addEventListener('click', function() {
                    letterData[activeIndex].viewMode = 'list';
                    renderLetter(activeIndex);
                });
                document.getElementById('hudViewGrid').addEventListener('click', function() {
                    letterData[activeIndex].viewMode = 'grid';
                    renderLetter(activeIndex);
                });
                document.getElementById('hudViewBento').addEventListener('click', function() {
                    letterData[activeIndex].viewMode = 'bento';
                    renderLetter(activeIndex);
                });

                // New
                document.getElementById('hudNew').addEventListener('click', function() {
                    const c = document.getElementById('composer');
                    c.classList.contains('open') ? closeComposer() : openComposer();
                });

                // Scroll settle
                let settleTimer = null;
                const track = document.getElementById('lettersTrack');
                track.addEventListener('scroll', () => {
                    clearTimeout(settleTimer);
                    settleTimer = setTimeout(() => {
                        const rect = track.getBoundingClientRect();
                        const centerX = rect.left + rect.width / 2;
                        let best = 0,
                            bestDist = Infinity;
                        Array.from(track.children).forEach((panel, i) => {
                            const r = panel.getBoundingClientRect();
                            const c = r.left + r.width / 2;
                            const d = Math.abs(c - centerX);
                            if (d < bestDist) { bestDist = d;
                                best = i; }
                        });
                        if (best !== activeIndex) {
                            const panels = track.querySelectorAll('.letter-panel');
                            panels.forEach(p => p.classList.remove('active'));
                            activeIndex = best;
                            panels[best].classList.add('active');
                            renderLetter(activeIndex);
                        }
                    }, 150);
                }, { passive: true });

                // Drag to scroll
                let isDragging = false,
                    dragStartX = 0,
                    dragStartScroll = 0;
                track.addEventListener('pointerdown', (e) => {
                    if (e.pointerType === 'touch') return;
                    if (e.target.closest('.letter-row, .grid-item, .card, button, a')) return;
                    isDragging = true;
                    dragStartX = e.clientX;
                    dragStartScroll = track.scrollLeft;
                    track.classList.add('dragging');
                    track.setPointerCapture(e.pointerId);
                });
                track.addEventListener('pointermove', (e) => {
                    if (!isDragging) return;
                    track.scrollLeft = dragStartScroll - (e.clientX - dragStartX);
                });
                track.addEventListener('pointerup', () => { isDragging = false;
                    track.classList.remove('dragging'); });
                track.addEventListener('pointercancel', () => { isDragging = false;
                    track.classList.remove('dragging'); });

                // Keyboard
                document.addEventListener('keydown', (e) => {
                    if (e.target.closest('.letter-row, .grid-item, .card, button, a, input, textarea'))
                        return;
                    if (e.key === 'ArrowLeft') { e.preventDefault();
                        activatePanel(activeIndex - 1); }
                    if (e.key === 'ArrowRight') { e.preventDefault();
                        activatePanel(activeIndex + 1); }
                    if (e.key === 'Escape' && focusMode) setFocusMode(false);
                });

                // Composer
                document.getElementById('c-cancel').addEventListener('click', closeComposer);
                document.getElementById('composerClose').addEventListener('click', closeComposer);
                setupComposerDrag();
                document.getElementById('c-post').addEventListener('click', () => {
                    const authorId = document.getElementById('c-author-select').value;
                    const tag = document.getElementById('c-tag').value.trim().toUpperCase();
                    const mediaUrl = document.getElementById('c-media').value.trim();
                    const text = document.getElementById('c-text').value.trim();
                    if (!text || !authorId) return;
                    statements.unshift({ id: uid(), authorId, time: Date.now(), tag, text, mediaUrl,
                    replies: [] });
                    saveData();
                    closeComposer();
                    renderLetter(activeIndex);
                    document.getElementById('topCount').textContent = String(statements.length).padStart(3, '0');
                });

                // Filters
                document.getElementById('filterToggleBtn').addEventListener('click', openBento);
                document.getElementById('bentoClose').addEventListener('click', closeBento);
                document.getElementById('bentoOverlay').addEventListener('click', (e) => {
                    if (e.target === e.currentTarget) closeBento();
                });
                document.getElementById('bentoClearAll').addEventListener('click', () => {
                    clearFilters();
                    populateBentoChips();
                });
                document.getElementById('bentoApply').addEventListener('click', () => {
                    searchQuery = document.getElementById('bentoSearch').value.trim();
                    closeBento();
                    renderLetter(activeIndex);
                });
                document.getElementById('bentoSearch').addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') document.getElementById('bentoApply').click();
                });
                document.getElementById('hudClear').addEventListener('click', clearFilters);

                // Conversation modal
                document.getElementById('modalClose').addEventListener('click', closeConversation);
                document.getElementById('conversationModal').addEventListener('click', (e) => {
                    if (e.target === e.currentTarget) closeConversation();
                });

                document.addEventListener('keydown', (e) => {
                    if (e.key === 'Escape') {
                        closeConversation();
                        if (document.getElementById('bentoOverlay').classList.contains('open')) closeBento();
                    }
                });

                // Initial render
                renderLetter(0);
              } catch (err) {
                // Fail loudly instead of silently — a single missing element
                // used to abort init partway through and take the HUD,
                // composer, and filters down with it with no visible sign.
                console.error('neverever.land init failed:', err);
              }
            });
        })();

        // ── custom cursor — dot + inertia ellipse. Suppressed over real
        // controls (buttons, links, drag handles, form fields) via
        // body.write-native-cursor so those keep their native affordance.
        (function initWriteCursor(){
            const writeCursorDot = document.getElementById('writeCursorDot');
            const writeCursorEllipse = document.getElementById('writeCursorEllipse');
            if (!writeCursorDot || !writeCursorEllipse) return;

            const NATIVE_SELECTOR = [
                'button', 'a', 'input', 'textarea', 'select', 'label',
                '[contenteditable="true"]', '[role="button"]',
                '.composer-header'
            ].join(', ');

            const ELLIPSE_LERP = 0.22;
            const SPEED_SATURATE = 34;
            const MAX_STRETCH = 0.6;

            let ptrX = 0, ptrY = 0;
            let prevFrameX = 0, prevFrameY = 0, frameInit = false;
            let ellAngle = 0, ellScaleX = 1, ellScaleY = 1;
            let rafId = null;

            function shortAngleLerp(current, target, factor){
                const diff = ((target - current + 540) % 360) - 180;
                return current + diff * factor;
            }

            function step(){
                if (!frameInit){ prevFrameX = ptrX; prevFrameY = ptrY; frameInit = true; }
                const dx = ptrX - prevFrameX;
                const dy = ptrY - prevFrameY;
                prevFrameX = ptrX; prevFrameY = ptrY;

                const speed = Math.hypot(dx, dy);
                const angleTarget = speed > 0.4 ? Math.atan2(dy, dx) * (180 / Math.PI) : ellAngle;
                const stretch = Math.min(speed / SPEED_SATURATE, 1) * MAX_STRETCH;

                ellAngle = shortAngleLerp(ellAngle, angleTarget, ELLIPSE_LERP);
                ellScaleX += ((1 + stretch) - ellScaleX) * ELLIPSE_LERP;
                ellScaleY += ((1 - stretch * 0.45) - ellScaleY) * ELLIPSE_LERP;

                writeCursorEllipse.style.transform =
                    'translate(' + ptrX + 'px,' + ptrY + 'px) rotate(' + ellAngle + 'deg) scale(' + ellScaleX + ',' + ellScaleY + ')';

                rafId = requestAnimationFrame(step);
            }
            function startLoop(){ if (!rafId) rafId = requestAnimationFrame(step); }
            function stopLoop(){ if (rafId){ cancelAnimationFrame(rafId); rafId = null; } }

            function hideAll(){
                writeCursorDot.classList.remove('visible');
                writeCursorEllipse.classList.remove('visible');
                document.body.classList.remove('write-native-cursor', 'custom-cursor-active');
                stopLoop();
            }

            window.addEventListener('mousemove', (e) => {
                const overNative = !!e.target.closest(NATIVE_SELECTOR);
                document.body.classList.add('custom-cursor-active');
                document.body.classList.toggle('write-native-cursor', overNative);

                ptrX = e.clientX; ptrY = e.clientY;

                writeCursorDot.style.transform = 'translate(' + ptrX + 'px,' + ptrY + 'px)';
                writeCursorDot.classList.add('visible');
                writeCursorEllipse.classList.add('visible');

                startLoop();
            });
            document.addEventListener('mouseleave', hideAll);
        })();
    </script>
</body>
