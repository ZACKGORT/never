<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>neverever.land · 2026</title>
    <link href="https://api.fontshare.com/v2/css?f[]=satoshi@1,2,3,4,5,6,7,8,9&display=swap" rel="stylesheet" />
    <style>
        /* ── design system ────────────────────────────────────────── */
        :root {
            --bg: #f0f0f2;
            --card: #ffffff;
            --card-dark: #1C1C1E;
            --card-mid: #3A3A3C;
            --accent: #E5E567;
            --accent-2: #F5F557;
            --ink: #1C1C1E;
            --ink-mid: #3A3A3C;
            --ink-light: #8e8e93;
            --ink-lighter: #b0b0b6;
            --border: #e6e6e8;
            --shadow: 0 4px 12px rgba(0, 0, 0, 0.04);
            --shadow-hover: 0 16px 40px rgba(0, 0, 0, 0.08), 0 4px 12px rgba(0, 0, 0, 0.02);
            --radius: 1.25rem;
            --radius-sm: 0.65rem;
            --font: 'Satoshi', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            --font-mono: 'JetBrains Mono', 'IBM Plex Mono', monospace;
            --fs-body: 15px;
            --fs-display: 54px;
            --max-width: 1440px;
            --transition: 0.25s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            --margin: 16px;
            --topbar-height: 56px;
            --hud-height: 52px;
        }

        @media (min-width: 640px) {
            :root {
                --margin: 24px;
                --topbar-height: 64px;
                --hud-height: 56px;
            }
        }
        @media (min-width: 1024px) {
            :root {
                --margin: 32px;
                --topbar-height: 72px;
                --hud-height: 60px;
            }
        }

        body[data-scale="s"] { --fs-body: 12px; --fs-display: 40px; }
        body[data-scale="m"] { --fs-body: 15px; --fs-display: 54px; }
        body[data-scale="l"] { --fs-body: 18px; --fs-display: 68px; }
        body[data-scale="xl"] { --fs-body: 21px; --fs-display: 82px; }
        body[data-scale="xxl"] { --fs-body: 24px; --fs-display: 96px; }

        body[data-font="satoshi"] { --font: 'Satoshi', sans-serif; }
        body[data-font="inter"] { --font: 'Inter', sans-serif; }
        body[data-font="serif"] { --font: 'EB Garamond', serif; }
        body[data-font="mono"] { --font: 'JetBrains Mono', monospace; }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        html { -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent; }
        body {
            background: var(--bg);
            color: var(--ink);
            font-family: var(--font);
            font-size: var(--fs-body);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            min-height: 100vh;
            min-height: 100dvh;
            padding-bottom: calc(var(--hud-height) + 20px);
            transition: font-size 0.2s ease, font-family 0.2s ease;
            overflow-x: hidden;
        }
        ::selection { background: var(--accent); color: var(--ink); }

        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-thumb { background: var(--ink-lighter); border-radius: var(--radius-sm); }
        html { scrollbar-width: thin; scrollbar-color: var(--ink-lighter) transparent; }

        .t-micro {
            font-family: var(--font-mono);
            font-size: 8px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--ink-light);
            line-height: 1.4;
        }
        .t-data { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
        .co-badge {
            font-family: var(--font-mono);
            font-size: 6px;
            color: var(--ink-light);
            border: 1px solid var(--border);
            padding: 0 3px;
            flex: none;
            letter-spacing: 0.06em;
            border-radius: 2px;
        }

        .btn {
            font-family: var(--font-mono);
            font-size: 8px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            background: transparent;
            border: 1px solid var(--border);
            color: var(--ink-mid);
            padding: 6px 12px;
            cursor: pointer;
            transition: background .2s ease, color .2s ease, border-color .2s ease;
            border-radius: var(--radius-sm);
            font-weight: 500;
            touch-action: manipulation;
            min-height: 32px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            white-space: nowrap;
        }
        .btn:hover { background: var(--ink); color: var(--card); border-color: var(--ink); }
        .btn:active { transform: scale(0.97); }
        .btn.ghost { border-color: var(--border); color: var(--ink-light); }
        .btn.ghost:hover { background: var(--ink); color: var(--card); border-color: var(--ink); }
        .btn.small { padding: 3px 8px; font-size: 7px; min-height: 24px; }
        .btn.active { background: var(--ink); color: var(--card); border-color: var(--ink); }
        .btn-primary { background: var(--ink); color: var(--card); border-color: var(--ink); }
        .btn-primary:hover { background: var(--ink-mid); border-color: var(--ink-mid); }
        .btn-accent { background: var(--accent); color: var(--ink); border-color: var(--accent); }
        .btn-accent:hover { background: var(--accent-2); border-color: var(--accent-2); }

        @media (max-width: 480px) {
            .btn { font-size: 7px; padding: 5px 10px; min-height: 28px; }
        }

        /* ── topbar ── */
        .topbar {
            position: sticky;
            top: 0;
            z-index: 50;
            background: rgba(240, 240, 242, 0.88);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border);
            padding: 8px 0;
            min-height: var(--topbar-height);
            display: flex;
            align-items: center;
        }
        .topbar .wrap {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            padding: 0 var(--margin);
            max-width: var(--max-width);
            margin: 0 auto;
            width: 100%;
        }
        .wordmark {
            font-family: var(--font);
            font-size: clamp(12px, 3.5vw, 20px);
            font-weight: 700;
            letter-spacing: -0.03em;
            display: flex;
            align-items: baseline;
            gap: 6px;
            color: var(--ink);
            flex-shrink: 0;
        }
        .wordmark .count {
            font-family: var(--font-mono);
            font-size: 8px;
            font-weight: 400;
            color: var(--ink-light);
            letter-spacing: 0.04em;
        }
        .save-status {
            font-family: var(--font-mono);
            font-size: 7px;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: var(--ink-light);
            transition: color .2s ease;
            white-space: nowrap;
        }
        .save-status.err { color: #e74c3c; cursor: pointer; }
        .save-status.ok { color: var(--ink-light); }

        .topbar-actions {
            display: flex;
            align-items: center;
            gap: 4px;
            flex-shrink: 0;
        }
        .topbar-controls {
            display: flex;
            align-items: center;
            gap: 4px;
            background: var(--card);
            padding: 2px 6px 2px 10px;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
        }
        .topbar-controls .font-select {
            background: transparent;
            border: none;
            color: var(--ink);
            font-family: var(--font);
            font-size: 8px;
            padding: 4px 0;
            cursor: pointer;
            outline: none;
            max-width: 56px;
            font-weight: 500;
            -webkit-appearance: none;
            appearance: none;
        }
        .topbar-controls .font-select option { background: var(--card); color: var(--ink); }
        .topbar-controls .scale-group {
            display: flex;
            gap: 1px;
            border-left: 1px solid var(--border);
            padding-left: 6px;
        }
        .topbar-controls .scale-group .chip {
            border: none;
            padding: 2px 4px;
            font-size: 7px;
            color: var(--ink-light);
            background: transparent;
            border-radius: 3px;
            cursor: pointer;
            font-family: var(--font-mono);
            letter-spacing: 0.04em;
            font-weight: 500;
            touch-action: manipulation;
        }
        .topbar-controls .scale-group .chip.active { background: var(--ink); color: var(--card); }
        .topbar-controls .scale-group .chip:hover { color: var(--ink); }
        .topbar-actions .btn { min-height: 30px; padding: 4px 10px; font-size: 7px; }

        @media (max-width: 640px) {
            .topbar-controls .font-select { max-width: 40px; font-size: 7px; }
            .topbar-controls .scale-group .chip { font-size: 6px; padding: 1px 3px; }
            .topbar-controls { padding: 2px 4px 2px 6px; }
            .topbar-actions .btn { padding: 3px 8px; font-size: 6px; min-height: 26px; }
            .wordmark { font-size: clamp(10px, 3vw, 16px); }
            .wordmark .count { font-size: 7px; }
            .save-status { font-size: 6px; }
        }

        /* ── main wrap ── */
        .wrap {
            max-width: var(--max-width);
            margin: 0 auto;
            padding: 12px var(--margin) 100px;
            transition: padding 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }
        @media (max-width: 480px) { .wrap { padding: 8px 8px 80px; } }

        /* ── composer ── */
        .composer {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 16px 18px;
            display: none;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 16px;
            box-shadow: var(--shadow);
        }
        .composer.open { display: flex; }
        .field-row { display: flex; gap: 10px; flex-wrap: wrap; }
        .field-row .field { flex: 1; min-width: 120px; }
        label.t-micro { display: block; margin-bottom: 3px; font-size: 7px; letter-spacing: 0.1em; color: var(--ink-light); }
        input[type=text], textarea, select {
            width: 100%;
            background: var(--bg);
            border: 1px solid var(--border);
            color: var(--ink);
            padding: 8px 10px;
            font-size: calc(var(--fs-body) * 0.85);
            font-family: var(--font);
            border-radius: var(--radius-sm);
            resize: vertical;
            transition: border-color .2s ease;
            -webkit-appearance: none;
            appearance: none;
        }
        input[type=text]:focus, textarea:focus, select:focus { outline: none; border-color: var(--ink); }
        textarea { min-height: 56px; line-height: 1.6; }
        .composer-actions { display: flex; gap: 8px; justify-content: flex-end; align-items: center; flex-wrap: wrap; }
        .new-author-panel {
            border: 1px dashed var(--border);
            padding: 12px;
            display: none;
            flex-direction: column;
            gap: 8px;
            border-radius: var(--radius-sm);
        }
        .new-author-panel.open { display: flex; }
        .kind-radios { display: flex; gap: 12px; flex-wrap: wrap; }
        .kind-radios label {
            display: flex;
            align-items: center;
            gap: 4px;
            font-family: var(--font-mono);
            font-size: 8px;
            text-transform: uppercase;
            letter-spacing: .06em;
            cursor: pointer;
            color: var(--ink-mid);
        }
        @media (max-width: 480px) {
            .composer { padding: 12px 12px; border-radius: var(--radius-sm); }
            .field-row { flex-direction: column; gap: 8px; }
            .field-row .field { min-width: 100%; }
        }

        /* ── avatar ── */
        .avatar {
            flex: none;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: var(--font);
            font-weight: 600;
            border: 1px solid var(--border);
            position: relative;
            text-transform: uppercase;
            border-radius: var(--radius-sm);
            background: var(--bg);
            color: var(--ink);
            flex-shrink: 0;
        }
        .avatar.sz-xs { width: 20px; height: 20px; font-size: 7px; }
        .avatar.sz-sm { width: 28px; height: 28px; font-size: 9px; }
        .avatar.sz-md { width: 40px; height: 40px; font-size: 13px; }
        .avatar.sz-lg { width: 52px; height: 52px; font-size: 16px; }
        .avatar.v0 { background: var(--accent); color: var(--ink); border-color: var(--accent); }
        .avatar.v1 { background: var(--bg); color: var(--ink); }
        .avatar.v2 { background: var(--accent-2); color: var(--ink); border-color: var(--accent-2); }
        .avatar.v3 { background: var(--ink); color: var(--card); border-color: var(--ink); }
        .avatar.company::after {
            content: '';
            position: absolute;
            top: -2px;
            right: -2px;
            width: 5px;
            height: 5px;
            background: var(--accent);
            border: 1px solid var(--card);
            border-radius: 2px;
        }

        /* ── thumbnails ── */
        .thumb {
            border-radius: var(--radius-sm);
            overflow: hidden;
            background: var(--bg);
            flex: none;
            line-height: 0;
            flex-shrink: 0;
        }
        .thumb img, .thumb video { display: block; width: 100%; height: 100%; object-fit: cover; }
        .thumb-sm { width: 56px; height: 40px; border: 1px solid var(--border); }
        .thumb-md { width: 100%; height: 100px; border: 1px solid var(--border); margin: 4px 0 4px; }
        .thumb-lg {
            border: 1px solid var(--border);
            margin: 10px 0 12px;
            border-radius: var(--radius-sm);
            max-height: 320px;
            background: var(--bg);
        }
        .thumb-lg img, .thumb-lg video { display: block; width: 100%; height: auto; max-height: 320px; object-fit: cover; }
        .thumb-grid {
            width: 100%;
            height: 120px;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            margin: 6px 0 4px;
            overflow: hidden;
            background: var(--bg);
        }
        .thumb-grid img, .thumb-grid video { display: block; width: 100%; height: 100%; object-fit: cover; }

        @media (max-width: 480px) {
            .thumb-sm { width: 44px; height: 32px; }
            .thumb-grid { height: 100px; }
            .thumb-lg { max-height: 220px; }
            .thumb-lg img, .thumb-lg video { max-height: 220px; }
            .thumb-md { height: 80px; }
        }

        /* ── LIST VIEW ── */
        .list { border-top: 1px solid var(--border); padding-top: 4px; }
        .row {
            display: grid;
            grid-template-columns: 24px 32px 1fr auto;
            grid-template-areas: "idx avatar text marker";
            align-items: start;
            gap: 10px;
            padding: 14px 0;
            border-bottom: 1px solid var(--border);
            cursor: pointer;
            transition: background .15s ease;
        }
        .row:hover { background: rgba(0, 0, 0, 0.02); }
        .row:active { background: rgba(0, 0, 0, 0.04); }
        .row-idx { grid-area: idx; font-family: var(--font-mono); font-size: 10px; color: var(--ink-light); padding-top: 2px; }
        .row-avatar { grid-area: avatar; }
        .row-avatar .avatar { width: 32px; height: 32px; font-size: 10px; }
        .row-text-wrap {
            grid-area: text;
            display: flex;
            flex-direction: column;
            gap: 2px;
            min-width: 0;
        }
        .row-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 8px; font-size: 10px; }
        .row-author {
            font-family: var(--font);
            font-size: calc(var(--fs-body) * 0.85);
            font-weight: 600;
            letter-spacing: 0.02em;
            text-transform: uppercase;
            color: var(--ink);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            max-width: 120px;
        }
        .row-time { font-family: var(--font-mono); font-size: 8px; color: var(--ink-light); white-space: nowrap; }
        .row-text {
            color: var(--ink-mid);
            font-size: calc(var(--fs-body) * 0.92);
            font-weight: 400;
            white-space: normal;
            word-wrap: break-word;
            line-height: 1.5;
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
        }
        .row-marker {
            grid-area: marker;
            font-family: var(--font-mono);
            font-size: 8px;
            color: var(--ink-light);
            display: flex;
            align-items: center;
            gap: 6px;
            justify-content: flex-end;
            flex-wrap: wrap;
            padding-left: 4px;
            flex-shrink: 0;
        }
        .row-marker .thumb-sm { width: 56px; height: 40px; }

        .empty { padding: 40px 0; text-align: left; }
        .empty .t-micro { margin-bottom: 4px; }
        .empty p {
            font-family: var(--font);
            font-size: calc(var(--fs-display) * 0.4);
            font-weight: 600;
            letter-spacing: -0.02em;
            margin: 0 0 12px;
            color: var(--ink);
        }

        @media (max-width: 480px) {
            .row {
                grid-template-columns: 20px 28px 1fr auto;
                gap: 8px;
                padding: 12px 0;
            }
            .row-avatar .avatar { width: 28px; height: 28px; font-size: 8px; }
            .row-author { font-size: calc(var(--fs-body) * 0.8); max-width: 80px; }
            .row-text { font-size: calc(var(--fs-body) * 0.88); -webkit-line-clamp: 2; }
            .row-time { font-size: 7px; }
            .row-idx { font-size: 8px; }
            .row-marker { font-size: 7px; }
            .row-marker .thumb-sm { width: 44px; height: 32px; }
        }

        /* ── GRID MODE (Infinite Scroll Bento) ── */
        body.grid-mode .wrap { max-width: 100%; padding-left: var(--margin); padding-right: var(--margin); }

        body.grid-mode .list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            border-top: none;
            padding-top: 16px;
        }

        body.grid-mode .row {
            display: flex;
            flex-direction: column;
            align-items: stretch;
            padding: 18px 20px 22px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            transition: transform 0.25s cubic-bezier(0.25, 0.46, 0.45, 0.94),
                box-shadow 0.25s ease;
            cursor: pointer;
            gap: 8px;
            grid-template-columns: none;
            grid-template-areas: none;
            position: relative;
            box-shadow: var(--shadow);
            min-height: 180px;
        }

        body.grid-mode .row:hover { transform: translateY(-3px); box-shadow: var(--shadow-hover); }
        body.grid-mode .row:active { transform: scale(0.98); }

        body.grid-mode .row .row-idx { display: none; }

        body.grid-mode .row .row-top {
            display: flex;
            align-items: center;
            gap: 12px;
            width: 100%;
        }

        body.grid-mode .row .row-avatar .avatar { width: 44px; height: 44px; font-size: 14px; }

        body.grid-mode .row .row-meta {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 2px;
            flex: 1;
            font-size: calc(var(--fs-body) * 0.75);
        }

        body.grid-mode .row .row-author {
            font-size: calc(var(--fs-body) * 0.9);
            font-weight: 700;
            max-width: 100%;
            white-space: normal;
            text-overflow: clip;
        }

        body.grid-mode .row .row-time { font-size: calc(var(--fs-body) * 0.65); }

        body.grid-mode .row .row-text {
            font-size: calc(var(--fs-body) * 1.0);
            font-weight: 500;
            line-height: 1.4;
            letter-spacing: -0.01em;
            color: var(--ink);
            width: 100%;
            margin: 4px 0 6px;
            -webkit-line-clamp: 3;
        }

        body.grid-mode .row .row-marker {
            font-size: calc(var(--fs-body) * 0.6);
            align-self: flex-start;
            margin-top: 6px;
            border-top: 1px solid var(--border);
            padding-top: 10px;
            width: 100%;
            justify-content: flex-start;
            gap: 8px;
        }

        body.grid-mode .row .thumb-grid {
            width: 100%;
            height: 150px;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            margin: 4px 0 6px;
            overflow: hidden;
            background: var(--bg);
        }

        body.grid-mode .row .thumb-grid img,
        body.grid-mode .row .thumb-grid video {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        body.grid-mode .row .row-tag {
            font-family: var(--font-mono);
            font-size: 7px;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: var(--ink-light);
            border: 1px solid var(--border);
            padding: 1px 8px;
            border-radius: var(--radius-sm);
            align-self: flex-start;
        }

        /* Grid mode responsive */
        @media (max-width: 640px) {
            body.grid-mode .list {
                grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
                gap: 14px;
                padding-top: 12px;
            }
            body.grid-mode .row { padding: 14px 14px 18px; border-radius: var(--radius-sm); }
            body.grid-mode .row .row-avatar .avatar { width: 36px; height: 36px; font-size: 11px; }
            body.grid-mode .row .row-text { font-size: calc(var(--fs-body) * 0.92); -webkit-line-clamp: 3; }
            body.grid-mode .row .thumb-grid { height: 120px; }
        }

        @media (max-width: 480px) {
            body.grid-mode .list {
                grid-template-columns: 1fr;
                gap: 12px;
                padding-top: 8px;
            }
            body.grid-mode .row { padding: 12px 14px 16px; }
            body.grid-mode .row .row-avatar .avatar { width: 32px; height: 32px; font-size: 10px; }
            body.grid-mode .row .row-text { font-size: calc(var(--fs-body) * 0.88); -webkit-line-clamp: 3; }
            body.grid-mode .row .thumb-grid { height: 100px; }
        }

        /* ── conversation modal ── */
        .conversation-modal {
            position: fixed;
            inset: 0;
            z-index: 300;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            display: flex;
            align-items: flex-start;
            justify-content: center;
            padding: 0;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.35s ease;
            overflow: hidden;

            async function loadData() {
                try {
                    const res = await window.storage.get(STORAGE_KEY, false);
                    if (res && res.value) {
                        const parsed = JSON.parse(res.value);
                        authors = parsed.authors || [];
                        statements = parsed.statements || [];
                        if (authors.length && statements.length) return;
                    }
                } catch (e) {}
                authors = seedAuthors();
                statements = seedStatements(authors);
                await saveData();
            }

            let saveInFlight = false;
            let pendingRetry = false;

            function setSaveStatus(state) {
                const el = document.getElementById('saveStatus');
                if (!el) return;
                el.classList.remove('err', 'ok');
                if (state === 'saving') { el.textContent = '· saving…'; } else if (state === 'ok') { el.textContent =
                        '· saved';
                    el.classList.add('ok'); } else if (state === 'err') { el.textContent = '· not saved — click to retry';
                    el.classList.add('err'); } else { el.textContent = ''; }
            }

            async function saveData(isRetry) {
                if (saveInFlight) { pendingRetry = true; return; }
                saveInFlight = true;
                setSaveStatus('saving');
                try {
                    await window.storage.set(STORAGE_KEY, JSON.stringify({ authors, statements }), false);
                    setSaveStatus('ok');
                } catch (e) {
                    console.error('storage save failed', e);
                    if (!isRetry) {
                        saveInFlight = false;
                        await new Promise(r => setTimeout(r, 800));
                        return saveData(true);
                    }
                    setSaveStatus('err');
                } finally {
                    saveInFlight = false;
                    if (pendingRetry) { pendingRetry = false;
                        saveData(); }
                }
            }

            document.getElementById('saveStatus').addEventListener('click', () => {
                if (document.getElementById('saveStatus').classList.contains('err')) saveData();
            });

            function fmtTime(ts) {
                const d = new Date(ts);
                const now = new Date();
                const sameDay = d.toDateString() === now.toDateString();
                const yest = new Date(now);
                yest.setDate(now.getDate() - 1);
                const isYest = d.toDateString() === yest.toDateString();
                const hh = d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }).toUpperCase();
                if (sameDay) return 'TODAY ' + hh;
                if (isYest) return 'YESTERDAY';
                return d.toLocaleDateString([], { month: 'short', day: 'numeric' }).toUpperCase();
            }

            function isVideo(url) { return /\.(mp4|webm|mov)(\?|$)/i.test(url); }

            function countReplies(node) {
                let n = node.replies.length;
                node.replies.forEach(r => n += countReplies(r));
                return n;
            }

            function countAuthorActivity(authorId) {
                let statementsCount = 0,
                    repliesCount = 0;

                function walk(node, isTop) {
                    if (node.authorId === authorId) { isTop ? statementsCount++ : repliesCount++; }
                    node.replies.forEach(r => walk(r, false));
                }
                statements.forEach(s => walk(s, true));
                return { statementsCount, repliesCount };
            }

            function escapeHtml(s) {
                return (s || '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;',
                    "'": '&#39;' } [c]));
            }

            function el(html) {
                const t = document.createElement('template');
                t.innerHTML = html.trim();
                return t.content.firstElementChild;
            }

            function avatarHtml(authorId, size) {
                const a = authorById(authorId);
                if (!a) return `<div class="avatar sz-${size} v1">?</div>`;
                const cls = ['avatar', 'sz-' + size, avatarVariant(a.id)];
                if (a.kind === 'company') cls.push('company');
                return `<div class="${cls.join(' ')}">${escapeHtml(initialsFor(a))}</div>`;
            }

            function openProfile(authorId) {
                const a = authorById(authorId);
                if (!a) return;
                document.getElementById('profileAvatarSlot').innerHTML = avatarHtml(a.id, 'lg');
                document.getElementById('profileName').textContent = a.name;
                document.getElementById('profileKind').textContent = a.kind === 'company' ? 'COMPANY / BRAND' : 'PERSON';
                document.getElementById('profileRole').textContent = a.role || '';
                document.getElementById('profileTagline').textContent = a.tagline || '';
                const { statementsCount, repliesCount } = countAuthorActivity(a.id);
                document.getElementById('profileStats').textContent =
                    `${statementsCount} STATEMENT${statementsCount===1?'':'S'} · ${repliesCount} REPL${repliesCount===1?'Y':'IES'}`;
                document.getElementById('profileModal').hidden = false;
            }
            document.getElementById('profileClose').addEventListener('click', () => document.getElementById('profileModal')
                .hidden = true);
            document.getElementById('profileModal').addEventListener('click', (e) => {
                if (e.target.id === 'profileModal') document.getElementById('profileModal').hidden = true;
            });

            function passesFilters(s) {
                const a = authorById(s.authorId);
                if (!a) return false;

                if (searchQuery) {
                    const q = searchQuery.toLowerCase();
                    const matchesText = s.text.toLowerCase().includes(q);
                    const matchesAuthor = a.name.toLowerCase().includes(q);
                    const matchesTag = s.tag ? s.tag.toLowerCase().includes(q) : false;
                    if (!matchesText && !matchesAuthor && !matchesTag) return false;
                }

                const tagOk = activeTags.size === 0 || (s.tag && activeTags.has(s.tag));
                const kindOk = activeKinds.size === 0 || (a && activeKinds.has(a.kind));
                const discOk = activeDisciplines.size === 0 || (a && activeDisciplines.has(a.discipline));
                return tagOk && kindOk && discOk;
            }

            function filtersActive() {
                return activeTags.size > 0 || activeKinds.size > 0 || activeDisciplines.size > 0 || searchQuery.length > 0;
            }

            function clearFilters() {
                activeTags.clear();
                activeKinds.clear();
                activeDisciplines.clear();
                searchQuery = '';
                document.getElementById('bentoSearch').value = '';
                currentPage = 0;
                allLoaded = false;
                render();
                updateFilterUI();
            }

            function openConversation(statementId) {
                modalStatementId = statementId;
                modalReplyTargetId = null;
                const modal = document.getElementById('conversationModal');
                modal.classList.add('open');
                document.body.style.overflow = 'hidden';
                renderModalContent(statementId);
            }

            function closeConversation() {
                document.getElementById('conversationModal').classList.remove('open');
                document.body.style.overflow = '';
                modalStatementId = null;
                modalReplyTargetId = null;
            }

            function renderMediaThumb(url, sizeClass) {
                if (!url) return '';
                const isVid = isVideo(url);
                const tag = isVid ? 'video' : 'img';
                const attrs = isVid ? 'controls playsinline muted' : 'alt=""';
                return `<div class="thumb ${sizeClass}"><${tag} src="${escapeHtml(url)}" ${attrs} loading="lazy" /></div>`;
            }

            function renderMediaHero(url) {
                if (!url) return '';
                const isVid = isVideo(url);
                const tag = isVid ? 'video' : 'img';
                const attrs = isVid ? 'controls playsinline' : 'alt=""';
                return `<div class="thumb-lg"><${tag} src="${escapeHtml(url)}" ${attrs} loading="lazy" /></div>`;
            }

            function renderMediaGrid(url) {
                if (!url) return '';
                const isVid = isVideo(url);
                const tag = isVid ? 'video' : 'img';
                const attrs = isVid ? 'controls playsinline muted' : 'alt=""';
                return `<div class="thumb-grid"><${tag} src="${escapeHtml(url)}" ${attrs} loading="lazy" /></div>`;
            }

            function renderModalNode(node, statement, depth) {
                const hasChildren = node.replies.length > 0;
                const isCollapsed = collapsed.has(node.id);
                const a = authorById(node.authorId);
                const wrap = document.createElement('div');
                wrap.className = 'modal-node';
                wrap.dataset.nodeId = node.id;

                let headHtml = `
              <div class="modal-node-head">
                ${hasChildren ? `<button class="modal-node-toggle" data-node-id="${node.id}">${isCollapsed ? '[+]' : '[–]'}</button>` : ''}
                ${avatarHtml(node.authorId,'xs')}
                <span class="modal-node-author" data-author-id="${node.authorId}">${a ? escapeHtml(a.name) : 'UNKNOWN'}</span>
                ${a && a.kind==='company' ? '<span class="co-badge">CO</span>' : ''}
                <span class="modal-node-time">${fmtTime(node.time)}</span>
                ${isCollapsed ? `<span class="modal-node-collapsed-note">(${countReplies(node)+1} hidden)</span>` : ''}
              </div>
            `;
                wrap.innerHTML = headHtml;

                const head = wrap.querySelector('.modal-node-head');
                head.querySelector('[data-author-id]').addEventListener('click', (e) => {
                    e.stopPropagation();
                    openProfile(e.target.dataset.authorId);
                });

                if (hasChildren) {
                    const toggle = head.querySelector('.modal-node-toggle');
                    toggle.addEventListener('click', (e) => {
                        e.stopPropagation();
                        if (isCollapsed) collapsed.delete(node.id);
                        else collapsed.add(node.id);
                        renderModalContent(modalStatementId);
                    });
                }

                if (!isCollapsed) {
                    const textDiv = document.createElement('div');
                    textDiv.className = 'modal-node-text';
                    textDiv.textContent = node.text;
                    wrap.appendChild(textDiv);

                    const actions = document.createElement('div');
                    actions.className = 'modal-node-actions';
                    const replyBtn = document.createElement('button');
                    replyBtn.className = 'modal-node-link';
                    replyBtn.textContent = 'reply';
                    replyBtn.dataset.action = 'reply';
                    replyBtn.dataset.nodeId = node.id;
                    replyBtn.addEventListener('click', () => {
                        modalReplyTargetId = (modalReplyTargetId === node.id) ? null : node.id;
                        renderModalContent(modalStatementId);
                    });
                    actions.appendChild(replyBtn);
                    wrap.appendChild(actions);

                    if (modalReplyTargetId === node.id) {
                        const form = renderModalReplyForm(node, statement);
                        wrap.appendChild(form);
                    }

                    if (node.replies.length > 0) {
                        const childWrap = document.createElement('div');
                        childWrap.className = 'modal-node-children';
                        node.replies.forEach(child => {
                            childWrap.appendChild(renderModalNode(child, statement, (depth || 0) + 1));
                        });
                        wrap.appendChild(childWrap);
                    }
                }

                return wrap;
            }

            function renderModalReplyForm(target, statement) {
                const form = document.createElement('div');
                form.className = 'modal-reply-form';
                const sel = document.createElement('select');
                sel.className = 'rf-author';
                sel.innerHTML = authorOptionsHtml();
                sel.value = lastAuthorId || authors[0].id;

                const ta = document.createElement('textarea');
                ta.className = 'rf-text';
                ta.placeholder = 'Write a reply…';
                ta.style.minHeight = '50px';

                const actions = document.createElement('div');
                actions.className = 'composer-actions';

                const cancelBtn = document.createElement('button');
                cancelBtn.className = 'btn ghost small';
                cancelBtn.textContent = 'Cancel';
                cancelBtn.dataset.action = 'cancel';
                cancelBtn.addEventListener('click', () => {
                    modalReplyTargetId = null;
                    renderModalContent(modalStatementId);
                });

                const submitBtn = document.createElement('button');
                submitBtn.className = 'btn btn-primary small';
                submitBtn.textContent = 'Post reply';
                submitBtn.dataset.action = 'submit';
                submitBtn.addEventListener('click', () => {
                    const authorId = sel.value;
                    const text = ta.value.trim();
                    if (!text || !authorId) return;
                    lastAuthorId = authorId;
                    target.replies.push({ id: uid(), authorId, time: Date.now(), text, replies: [] });
                    modalReplyTargetId = null;
                    saveData();
                    renderModalContent(modalStatementId);
                    render();
                });

                actions.appendChild(cancelBtn);
                actions.appendChild(submitBtn);
                form.appendChild(sel);
                form.appendChild(ta);
                form.appendChild(actions);
                return form;
            }

            function renderModalContent(statementId) {
                const s = statements.find(st => st.id === statementId);
                if (!s) return;
                const container = document.getElementById('modalContent');
                const a = authorById(s.authorId);

                let html = `
              <div class="modal-statement">
                <div class="card-who">
                  ${avatarHtml(s.authorId,'md')}
                  <div>
                    <div class="card-author-row">
                      <span class="card-author" data-author-id="${s.authorId}">${a ? escapeHtml(a.name) : 'UNKNOWN'}</span>
                      ${a && a.kind==='company' ? '<span class="co-badge">CO</span>' : ''}
                      <span class="card-time">${fmtTime(s.time)}</span>
                      ${s.tag ? `<span class="card-tag t-micro">${escapeHtml(s.tag)}</span>` : ''}
                    </div>
                    <div class="card-role">${a ? escapeHtml(a.role||'') : ''}</div>
                  </div>
                </div>
                ${renderMediaHero(s.mediaUrl)}
                <div class="card-text">${escapeHtml(s.text)}</div>
              </div>
              <div class="t-micro" style="margin-bottom:10px;">REPLIES (${countReplies(s)})</div>
              <div class="modal-thread" id="modalThread"></div>
              <div class="modal-reply-trigger" id="modalReplyTrigger"></div>
            `;

                container.innerHTML = html;

                container.querySelector('.card-author').addEventListener('click', () => {
                    openProfile(s.authorId);
                });

                const threadEl = container.querySelector('#modalThread');
                s.replies.forEach(r => {
                    threadEl.appendChild(renderModalNode(r, s, 0));
                });

                const trigger = container.querySelector('#modalReplyTrigger');
                const link = document.createElement('button');
                link.className = 'modal-node-link';
                link.textContent = '+ reply to this statement';
                link.addEventListener('click', () => {
                    modalReplyTargetId = (modalReplyTargetId === s.id) ? null : s.id;
                    renderModalContent(modalStatementId);
                });
                trigger.appendChild(link);

                if (modalReplyTargetId === s.id) {
                    const form = renderModalReplyForm(s, s);
                    trigger.appendChild(form);
                }
            }

            // ── Infinite scroll render ──
            function render() {
                currentPage = 0;
                allLoaded = false;
                if (gridMode) renderGridInfinite();
                else renderListInfinite();
                updateFilterUI();
            }

            function getFilteredStatements() {
                return statements.filter(s => passesFilters(s));
            }

            function renderListInfinite() {
                const root = document.getElementById('listRoot');
                root.innerHTML = '';
                const filtered = getFilteredStatements();

                if (filtered.length === 0) {
                    document.getElementById('topCount').textContent = '000';
                    root.appendChild(el(`
                        <div class="empty">
                            <div class="t-micro">000 STATEMENTS</div>
                            <p>${statements.length === 0 ? 'Nothing here yet.' : 'No matches for these filters.'}</p>
                            ${statements.length === 0 ? '<button class="btn btn-primary" id="emptyNew">Write the first one</button>' : '<button class="btn ghost" id="clearFromEmpty">Clear filters</button>'}
                        </div>
                    `));
                    const btn = root.querySelector('#emptyNew') || root.querySelector('#clearFromEmpty');
                    if (btn) btn.addEventListener('click', btn.id === 'emptyNew' ? openComposer : clearFilters);
                    renderHud();
                    return;
                }

                document.getElementById('topCount').textContent = filtersActive() ?
                    `${String(filtered.length).padStart(3,'0')} / ${String(statements.length).padStart(3,'0')}` :
                    String(statements.length).padStart(3, '0');

                const list = el('<div class="list"></div>');
                root.appendChild(list);

                const endIdx = Math.min(pageSize, filtered.length);
                for (let i = 0; i < endIdx; i++) {
                    const s = filtered[i];
                    const idx = String(statements.length - statements.indexOf(s)).padStart(3, '0');
                    list.appendChild(renderRow(s, idx));
                }

                if (filtered.length > pageSize) {
                    const trigger = el(`
                        <div class="load-more-trigger" id="loadMoreTrigger">
                            <span class="spinner" style="display:none;"></span>
                            <span class="load-text">Load more (${filtered.length - pageSize} remaining)</span>
                        </div>
                    `);
                    list.appendChild(trigger);
                    const observer = new IntersectionObserver((entries) => {
                        if (entries[0].isIntersecting && !isLoading && !allLoaded) {
                            loadMoreList(filtered, list);
                        }
                    }, { rootMargin: '0px 0px 100px 0px' });
                    observer.observe(trigger);
                    trigger._observer = observer;
                } else {
                    allLoaded = true;
                }

                populateAuthorSelects();
                renderHud();
            }

            function loadMoreList(filtered, list) {
                if (isLoading || allLoaded) return;
                isLoading = true;
                const trigger = list.querySelector('#loadMoreTrigger');
                if (trigger) {
                    trigger.querySelector('.spinner').style.display = 'inline-block';
                    trigger.querySelector('.load-text').textContent = 'Loading...';
                }

                setTimeout(() => {
                    const currentCount = list.querySelectorAll('.row:not(.load-more-trigger)').length;
                    const nextBatch = Math.min(currentCount + pageSize, filtered.length);
                    for (let i = currentCount; i < nextBatch; i++) {
                        const s = filtered[i];
                        const idx = String(statements.length - statements.indexOf(s)).padStart(3, '0');
                        list.insertBefore(renderRow(s, idx), trigger);
                    }
                    isLoading = false;
                    if (nextBatch >= filtered.length) {
                        allLoaded = true;
                        if (trigger) {
                            trigger.querySelector('.spinner').style.display = 'none';
                            trigger.querySelector('.load-text').textContent = 'All loaded ✓';
                        }
                    } else {
                        if (trigger) {
                            trigger.querySelector('.spinner').style.display = 'none';
                            trigger.querySelector('.load-text').textContent =
                                `Load more (${filtered.length - nextBatch} remaining)`;
                        }
                    }
                }, 300);
            }

            function renderGridInfinite() {
                const root = document.getElementById('listRoot');
                root.innerHTML = '';
                const filtered = getFilteredStatements();

                if (filtered.length === 0) {
                    document.getElementById('topCount').textContent = '000';
                    root.appendChild(el(`
                        <div class="empty">
                            <div class="t-micro">000 STATEMENTS</div>
                            <p>${statements.length === 0 ? 'Nothing here yet.' : 'No matches for these filters.'}</p>
                            ${statements.length === 0 ? '<button class="btn btn-primary" id="emptyNew">Write the first one</button>' : '<button class="btn ghost" id="clearFromEmpty">Clear filters</button>'}
                        </div>
                    `));
                    const btn = root.querySelector('#emptyNew') || root.querySelector('#clearFromEmpty');
                    if (btn) btn.addEventListener('click', btn.id === 'emptyNew' ? openComposer : clearFilters);
                    renderHud();
                    return;
                }

                document.getElementById('topCount').textContent = filtersActive() ?
                    `${String(filtered.length).padStart(3,'0')} / ${String(statements.length).padStart(3,'0')}` :
                    String(statements.length).padStart(3, '0');

                const list = el('<div class="list"></div>');
                root.appendChild(list);

                const endIdx = Math.min(pageSize, filtered.length);
                for (let i = 0; i < endIdx; i++) {
                    const s = filtered[i];
                    const idx = String(statements.length - statements.indexOf(s)).padStart(3, '0');
                    list.appendChild(renderGridItem(s, idx));
                }

                if (filtered.length > pageSize) {
                    const trigger = el(`
                        <div class="load-more-trigger" id="loadMoreTrigger">
                            <span class="spinner" style="display:none;"></span>
                            <span class="load-text">Load more (${filtered.length - pageSize} remaining)</span>
                        </div>
                    `);
                    list.appendChild(trigger);
                    const observer = new IntersectionObserver((entries) => {
                        if (entries[0].isIntersecting && !isLoading && !allLoaded) {
                            loadMoreGrid(filtered, list);
                        }
                    }, { rootMargin: '0px 0px 100px 0px' });
                    observer.observe(trigger);
                    trigger._observer = observer;
                } else {
                    allLoaded = true;
                }

                populateAuthorSelects();
                renderHud();
            }

            function loadMoreGrid(filtered, list) {
                if (isLoading || allLoaded) return;
                isLoading = true;
                const trigger = list.querySelector('#loadMoreTrigger');
                if (trigger) {
                    trigger.querySelector('.spinner').style.display = 'inline-block';
                    trigger.querySelector('.load-text').textContent = 'Loading...';
                }

                setTimeout(() => {
                    const currentCount = list.querySelectorAll('.row:not(.load-more-trigger)').length;
                    const nextBatch = Math.min(currentCount + pageSize, filtered.length);
                    for (let i = currentCount; i < nextBatch; i++) {
                        const s = filtered[i];
                        const idx = String(statements.length - statements.indexOf(s)).padStart(3, '0');
                        list.insertBefore(renderGridItem(s, idx), trigger);
                    }
                    isLoading = false;
                    if (nextBatch >= filtered.length) {
                        allLoaded = true;
                        if (trigger) {
                            trigger.querySelector('.spinner').style.display = 'none';
                            trigger.querySelector('.load-text').textContent = 'All loaded ✓';
                        }
                    } else {
                        if (trigger) {
                            trigger.querySelector('.spinner').style.display = 'none';
                            trigger.querySelector('.load-text').textContent =
                                `Load more (${filtered.length - nextBatch} remaining)`;
                        }
                    }
                }, 300);
            }

            function renderRow(s, idx) {
                const a = authorById(s.authorId);
                const marker = s.mediaUrl ? (isVideo(s.mediaUrl) ? 'VID' : 'IMG') : '';
                const row = el(`
              <div class="row" data-id="${s.id}">
                <div class="row-idx t-data">${idx}</div>
                <div class="row-avatar">${avatarHtml(s.authorId,'sm')}</div>
                <div class="row-text-wrap">
                  <div class="row-meta">
                    <span class="row-author">${a ? escapeHtml(a.name) : 'UNKNOWN'}${a && a.kind==='company' ? ' <span class="co-badge">CO</span>' : ''}</span>
                    <span class="row-time">${fmtTime(s.time)}</span>
                    ${s.tag ? `<span class="card-tag t-micro" style="font-size:6px;border:1px solid var(--border);padding:0 4px;border-radius:2px;">${escapeHtml(s.tag)}</span>` : ''}
                  </div>
                  <div class="row-text">${escapeHtml(s.text)}</div>
                </div>
                <div class="row-marker">
                  ${s.mediaUrl ? renderMediaThumb(s.mediaUrl, 'thumb-sm') : ''}
                  ${marker}
                </div>
              </div>
            `);
                row.addEventListener('click', () => { openConversation(s.id); });
                return row;
            }

            function renderGridItem(s, idx) {
                const a = authorById(s.authorId);
                const item = el(`
              <div class="row grid-item" data-id="${s.id}">
                <div class="row-top">
                  <div class="row-avatar">${avatarHtml(s.authorId,'sm')}</div>
                  <div class="row-meta">
                    <span class="row-author">${a ? escapeHtml(a.name) : 'UNKNOWN'}${a && a.kind==='company' ? ' <span class="co-badge">CO</span>' : ''}</span>
                    <span class="row-time">${fmtTime(s.time)}</span>
                    ${s.tag ? `<span class="row-tag">${escapeHtml(s.tag)}</span>` : ''}
                  </div>
                </div>
                <div class="row-text">${escapeHtml(s.text)}</div>
                ${s.mediaUrl ? renderMediaGrid(s.mediaUrl) : ''}
                <div class="row-marker">${countReplies(s)} replies</div>
              </div>
            `);
                item.addEventListener('click', () => { openConversation(s.id); });
                return item;
            }

            function updateFilterUI() {
                const count = activeTags.size + activeKinds.size + activeDisciplines.size + (searchQuery.length > 0 ? 1 : 0);
                document.getElementById('filterCount').textContent = count;
                const summary = document.getElementById('activeFilterSummary');
                if (count === 0) {
                    summary.textContent = 'No filters active';
                } else {
                    let parts = [];
                    if (searchQuery) parts.push(`"${searchQuery}"`);
                    if (activeTags.size > 0) parts.push(`${activeTags.size} tag${activeTags.size>1?'s':''}`);
                    if (activeKinds.size > 0) parts.push(`${activeKinds.size} kind${activeKinds.size>1?'s':''}`);
                    if (activeDisciplines.size > 0) parts.push(`${activeDisciplines.size} discipline${activeDisciplines.size>1?'s':''}`);
                    summary.textContent = `Active: ${parts.join(', ')}`;
                }
                document.getElementById('hudClear').hidden = count === 0;
            }

            function renderHud() { /* HUD always visible */ }

            function openBento() {
                const overlay = document.getElementById('bentoOverlay');
                overlay.classList.add('open');
                populateBentoChips();
                document.getElementById('bentoSearch').value = searchQuery;
                document.body.style.overflow = 'hidden';
            }

            function closeBento() {
                document.getElementById('bentoOverlay').classList.remove('open');
                document.body.style.overflow = '';
            }

            function populateBentoChips() {
                const tagContainer = document.querySelector('#bentoTags .chip-group');
                const tagCounts = {};
                statements.forEach(s => { if (s.tag) tagCounts[s.tag] = (tagCounts[s.tag] || 0) + 1; });
                tagContainer.innerHTML = '';
                Object.keys(tagCounts).sort().forEach(tag => {
                    const chip = document.createElement('button');
                    chip.className = 'chip' + (activeTags.has(tag) ? ' active' : '');
                    chip.textContent = `${tag} (${tagCounts[tag]})`;
                    chip.dataset.type = 'tag';
                    chip.dataset.value = tag;
                    chip.addEventListener('click', () => {
                        if (activeTags.has(tag)) activeTags.delete(tag);
                        else activeTags.add(tag);
                        populateBentoChips();
                    });
                    tagContainer.appendChild(chip);
                });

                const peopleContainer = document.querySelector('#bentoPeople .chip-group');
                peopleContainer.innerHTML = '';
                authors.filter(a => a.kind === 'person').forEach(a => {
                    const chip = document.createElement('button');
                    const isActive = activeKinds.has(a.id);
                    chip.className = 'chip' + (isActive ? ' active' : '');
                    chip.textContent = a.name;
                    chip.dataset.type = 'person';
                    chip.dataset.value = a.id;
                    chip.addEventListener('click', () => {
                        if (activeKinds.has(a.id)) activeKinds.delete(a.id);
                        else activeKinds.add(a.id);
                        populateBentoChips();
                    });
                    peopleContainer.appendChild(chip);
                });

                const companiesContainer = document.querySelector('#bentoCompanies .chip-group');
                companiesContainer.innerHTML = '';
                authors.filter(a => a.kind === 'company').forEach(a => {
                    const chip = document.createElement('button');
                    const isActive = activeKinds.has(a.id);
                    chip.className = 'chip' + (isActive ? ' active' : '');
                    chip.textContent = a.name;
                    chip.dataset.type = 'company';
                    chip.dataset.value = a.id;
                    chip.addEventListener('click', () => {
                        if (activeKinds.has(a.id)) activeKinds.delete(a.id);
                        else activeKinds.add(a.id);
                        populateBentoChips();
                    });
                    companiesContainer.appendChild(chip);
                });

                const discContainer = document.querySelector('#bentoDisciplines .chip-group');
                const discCounts = {};
                authors.forEach(a => { if (a.discipline) discCounts[a.discipline] = (discCounts[a.discipline] || 0) + 1; });
                discContainer.innerHTML = '';
                Object.keys(discCounts).sort().forEach(d => {
                    const chip = document.createElement('button');
                    chip.className = 'chip' + (activeDisciplines.has(d) ? ' active' : '');
                    chip.textContent = `${d} (${discCounts[d]})`;
                    chip.dataset.type = 'discipline';
                    chip.dataset.value = d;
                    chip.addEventListener('click', () => {
                        if (activeDisciplines.has(d)) activeDisciplines.delete(d);
                        else activeDisciplines.add(d);
                        populateBentoChips();
                    });
                    discContainer.appendChild(chip);
                });
            }

            function populateAuthorSelects() {
                const sel = document.getElementById('c-author-select');
                if (!sel) return;
                sel.innerHTML = authorOptionsHtml();
                sel.value = lastAuthorId || authors[0].id;
            }

            function authorOptionsHtml() {
                const people = authors.filter(a => a.kind === 'person');
                const companies = authors.filter(a => a.kind === 'company');
                const opt = a => `<option value="${a.id}">${escapeHtml(a.name)}</option>`;
                return `<optgroup label="People">${people.map(opt).join('')}</optgroup><optgroup label="Companies">${companies.map(opt).join('')}</optgroup>`;
            }

            function openComposer() {
                document.getElementById('composer').classList.add('open');
                populateAuthorSelects();
                document.getElementById('c-text').focus();
            }

            function closeComposer() {
                document.getElementById('composer').classList.remove('open');
                document.getElementById('c-tag').value = '';
                document.getElementById('c-media').value = '';
                document.getElementById('c-text').value = '';
                document.getElementById('newAuthorPanel').classList.remove('open');
            }

            // ── init ────────────────────────────────────────────────────

            document.getElementById('fontSelect').addEventListener('change', function() {
                document.body.setAttribute('data-font', this.value);
            });

            document.querySelectorAll('.scale-group .chip').forEach(btn => {
                btn.addEventListener('click', () => {
                    const scale = btn.dataset.scale;
                    document.body.setAttribute('data-scale', scale);
                    document.querySelectorAll('.scale-group .chip').forEach(b => {
                        b.classList.toggle('active', b.dataset.scale === scale);
                    });
                });
            });

            document.getElementById('toggleLayoutBtn').addEventListener('click', function() {
                gridMode = !gridMode;
                this.textContent = gridMode ? 'List' : 'Grid';
                document.body.classList.toggle('grid-mode');
                render();
            });

            document.getElementById('newBtn').addEventListener('click', () => {
                const c = document.getElementById('composer');
                c.classList.contains('open') ? closeComposer() : openComposer();
            });
            document.getElementById('c-cancel').addEventListener('click', closeComposer);
            document.getElementById('c-post').addEventListener('click', () => {
                const authorId = document.getElementById('c-author-select').value;
                const tag = document.getElementById('c-tag').value.trim().toUpperCase();
                const mediaUrl = document.getElementById('c-media').value.trim();
                const text = document.getElementById('c-text').value.trim();
                if (!text || !authorId) return;
                lastAuthorId = authorId;
                statements.unshift({ id: uid(), authorId, time: Date.now(), tag, text, mediaUrl, replies: [] });
                saveData();
                closeComposer();
                render();
            });

            document.getElementById('toggleNewAuthor').addEventListener('click', () => {
                document.getElementById('newAuthorPanel').classList.toggle('open');
            });
            document.querySelectorAll('input[name=na-kind]').forEach(r => {
                r.addEventListener('change', (e) => {
                    document.getElementById('na-role-label').textContent = e.target.value === 'company' ?
                        'Tagline' : 'Role';
                    document.getElementById('na-role').placeholder = e.target.value === 'company' ?
                        'Hiring: 2 product designers' : 'Creative Director';
                });
            });
            document.getElementById('na-save').addEventListener('click', () => {
                const name = document.getElementById('na-name').value.trim();
                if (!name) return;
                const kind = document.querySelector('input[name=na-kind]:checked').value;
                const role = document.getElementById('na-role').value.trim();
                const newAuthor = { id: uid(), kind, name, role: kind === 'person' ? role : (role || ''),
                    tagline: kind === 'company' ? role : '' };
                authors.push(newAuthor);
                saveData();
                populateAuthorSelects();
                document.getElementById('c-author-select').value = newAuthor.id;
                lastAuthorId = newAuthor.id;
                document.getElementById('na-name').value = '';
                document.getElementById('na-role').value = '';
                document.getElementById('newAuthorPanel').classList.remove('open');
            });

            document.getElementById('resetLink').addEventListener('click', async (e) => {
                e.preventDefault();
                authors = seedAuthors();
                statements = seedStatements(authors);
                modalReplyTargetId = null;
                collapsed.clear();
                lastAuthorId = null;
                clearFilters();
                await saveData();
                render();
            });

            document.getElementById('filterToggleBtn').addEventListener('click', openBento);
            document.getElementById('bentoClose').addEventListener('click', closeBento);
            document.getElementById('bentoOverlay').addEventListener('click', (e) => {
                if (e.target === e.currentTarget) closeBento();
            });
            document.getElementById('bentoClearAll').addEventListener('click', () => {
                clearFilters();
                populateBentoChips();
            });
            document.getElementById('bentoApply').addEventListener('click', () => {
                const searchInput = document.getElementById('bentoSearch');
                searchQuery = searchInput.value.trim();
                closeBento();
                render();
            });

            document.getElementById('bentoSearch').addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    document.getElementById('bentoApply').click();
                }
            });

            document.getElementById('hudClear').addEventListener('click', clearFilters);

            document.getElementById('modalClose').addEventListener('click', closeConversation);
            document.getElementById('conversationModal').addEventListener('click', (e) => {
                if (e.target === e.currentTarget) closeConversation();
            });

            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') {
                    closeConversation();
                    if (!document.getElementById('profileModal').hidden) {
                        document.getElementById('profileModal').hidden = true;
                    }
                    if (document.getElementById('bentoOverlay').classList.contains('open')) {
                        closeBento();
                    }
                }
            });

            loadData().then(render);
        })();
    </script>
</body>
</html>
